name: Build Folder Downloader APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/rbu/folderdl app/src/main/res/values app/src/main/res/xml
          cat > settings.gradle.kts <<'RBU_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FolderDownloader"
          include(":app")
          RBU_EOF
          cat > build.gradle.kts <<'RBU_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          RBU_EOF
          cat > gradle.properties <<'RBU_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          RBU_EOF
          cat > app/build.gradle.kts <<'RBU_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.rbu.folderdl"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.rbu.folderdl"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          RBU_EOF
          cat > app/src/main/AndroidManifest.xml <<'RBU_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application
                  android:label="Folder Downloader"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:theme="@style/FdlTheme"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".DownloadService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
                  <service
                      android:name=".WatchdogService"
                      android:exported="true"
                      android:label="Folder Downloader watchdog"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/watchdog_config" />
                  </service>
                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          RBU_EOF
          cat > app/src/main/res/values/strings.xml <<'RBU_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="watchdog_desc">Each time you open an app, checks that Folder Downloader is still downloading and brings it back if it was closed. It does not read your screen.</string>
          </resources>
          RBU_EOF
          cat > app/src/main/res/values/styles.xml <<'RBU_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="FdlTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowAnimationStyle">@null</item>
              </style>
          </resources>
          RBU_EOF
          cat > app/src/main/res/xml/watchdog_config.xml <<'RBU_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="300"
              android:description="@string/watchdog_desc" />
          RBU_EOF
          cat > app/src/main/java/com/rbu/folderdl/MainActivity.kt <<'RBU_EOF'
          package com.rbu.folderdl

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.view.inputmethod.EditorInfo
          import android.webkit.CookieManager
          import android.webkit.JavascriptInterface
          import android.webkit.URLUtil
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONTokener

          class MainActivity : Activity() {

              companion object {
                  const val REQ_TREE = 11
                  const val REQ_NOTIF = 22
                  @Volatile var instance: MainActivity? = null
                  const val UA = "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"
                  private val fileExt = Regex(".*\\.(mp4|mov|mkv|avi|webm|m4v|3gp|flv|wmv|mpg|mpeg|ts|mts|m2ts|zip|rar|7z|tar|gz|tgz)", RegexOption.IGNORE_CASE)
                  const val SELECT_JS = """(function(){if(window.__rbuDlInstalled)return;window.__rbuDlInstalled=true;window.__rbuSelectMode=false;
          var EXT=/\.(mp4|mov|mkv|avi|webm|m4v|3gp|flv|wmv|mpg|mpeg|ts|mts|m2ts|zip|rar|7z|tar|gz|tgz)([?#]|$)/i;
          function nm(a,u){var f=u.split('?')[0].split('/').pop()||'';try{f=decodeURIComponent(f);}catch(e){}if(/\.[A-Za-z0-9]{2,5}$/.test(f))return f;return (a.getAttribute&&a.getAttribute('download'))||(a.innerText||'').trim()||f||'download';}
          document.addEventListener('click',function(e){if(!window.__rbuSelectMode)return;var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();try{RbuDownloadBridge.add(a.href,nm(a,a.href),a.type||'');}catch(x){}},true);
          window.__rbuCollect=function(){var seen={},out=[];function add(u,t,m){if(!u||!/^https?:/i.test(u)||seen[u])return;seen[u]=1;out.push({u:u,n:t,m:m||''});}
          var a=document.querySelectorAll('a[href]');for(var i=0;i<a.length;i++){var x=a[i];if(EXT.test(x.href)||x.hasAttribute('download'))add(x.href,nm(x,x.href),x.type);}
          var v=document.querySelectorAll('video[src],source[src]');for(var j=0;j<v.length;j++){var s=v[j].src;if(s&&!/^blob:/i.test(s))add(s,s.split('?')[0].split('/').pop(),'video/mp4');}
          return JSON.stringify(out);};})();"""
              }

              private lateinit var wv: WebView
              private lateinit var root: LinearLayout
              private lateinit var address: EditText
              private lateinit var lockLayer: FrameLayout
              private lateinit var lockLabel: TextView
              private lateinit var unlockBtn: Button
              private lateinit var logView: TextView
              private lateinit var logScroll: ScrollView
              private lateinit var statusView: TextView
              private var floatBtn: Button? = null
              private var selBtn: Button? = null
              private var locked = false
              private var floating = false
              private var floatBox: FrameLayout? = null
              private var placeholder: TextView? = null
              private var floatTaps = 0
              private var lastFloatTap = 0L
              private var autoBoot = false
              private var selectMode = false
              private var folderPrompted = false
              private var warnShowing = false
              private var lastLogVersion = -1
              private val h = Handler(Looper.getMainLooper())

              private val engineListener: () -> Unit = {
                  refreshStatus()
                  refreshLog()
                  checkPrompts()
              }

              private val ticker = object : Runnable {
                  override fun run() {
                      refreshStatus()
                      h.postDelayed(this, 3000)
                  }
              }

              private fun dp(n: Int) = (n * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  instance = this
                  Engine.init(this)

                  root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Color.parseColor("#111111"))

                  fun btn(t: String, f: () -> Unit): Button {
                      val b = Button(this)
                      b.text = t
                      b.textSize = 11f
                      b.isAllCaps = false
                      b.minHeight = 0
                      b.minimumHeight = dp(40)
                      b.setPadding(dp(2), 0, dp(2), 0)
                      b.setOnClickListener { f() }
                      return b
                  }
                  fun row(vararg bs: Button): LinearLayout {
                      val r = LinearLayout(this)
                      r.orientation = LinearLayout.HORIZONTAL
                      for (b in bs) r.addView(b, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                      return r
                  }

                  val top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  address = EditText(this)
                  address.isSingleLine = true
                  address.hint = "Search or type a website"
                  address.setTextColor(Color.WHITE)
                  address.setHintTextColor(Color.GRAY)
                  address.textSize = 14f
                  address.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_URI
                  address.imeOptions = EditorInfo.IME_ACTION_GO
                  address.setOnEditorActionListener { _, _, _ ->
                      go()
                      true
                  }
                  top.addView(address, LinearLayout.LayoutParams(0, dp(44), 1f))
                  top.addView(btn("Go") { go() }, LinearLayout.LayoutParams(dp(60), dp(44)))
                  root.addView(top)

                  root.addView(row(
                      btn("Select folder") { pickFolder() },
                      btn("Downloads") { showDownloads() },
                      btn("Back") { if (wv.canGoBack()) wv.goBack() }
                  ))
                  selBtn = btn("Select mode: OFF") { toggleSelectMode() }
                  root.addView(row(
                      selBtn!!,
                      btn("Select page") { selectPage() },
                      btn("Reload") { wv.reload() }
                  ))
                  floatBtn = btn("Float") { toggleFloat() }
                  root.addView(row(
                      btn("Lock") { lockScreen(false) },
                      btn("Dim") { lockScreen(true) },
                      floatBtn!!
                  ))
                  root.addView(row(
                      btn("Watchdog") { setupWatchdog() },
                      btn("Battery") { batterySetting() },
                      btn("Clear log") { Engine.clearLog() }
                  ))

                  statusView = TextView(this)
                  statusView.setTextColor(Color.WHITE)
                  statusView.textSize = 12f
                  statusView.setPadding(dp(8), dp(4), dp(8), dp(4))
                  root.addView(statusView)

                  wv = WebView(this)
                  val s = wv.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.allowContentAccess = true
                  s.mediaPlaybackRequiresUserGesture = false
                  s.userAgentString = UA
                  s.setSupportZoom(true)
                  s.builtInZoomControls = true
                  s.displayZoomControls = false
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(wv, true)
                  wv.addJavascriptInterface(Bridge(), "RbuDownloadBridge")
                  wv.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                          val u = request?.url?.toString() ?: return false
                          if (request.isForMainFrame && request.method == "GET" && !selectMode) {
                              val path = u.substringBefore('#').substringBefore('?')
                              if ((u.startsWith("http://", true) || u.startsWith("https://", true)) && fileExt.matches(path)) {
                                  queueDownload(u, Uri.parse(u).lastPathSegment ?: "download", "", UA)
                                  return true
                              }
                          }
                          return false
                      }

                      override fun onPageFinished(view: WebView?, url: String?) {
                          if (url != null && !address.hasFocus()) address.setText(url)
                          view?.evaluateJavascript(SELECT_JS, null)
                          if (selectMode) view?.evaluateJavascript("window.__rbuSelectMode=true", null)
                      }
                  }
                  wv.webChromeClient = WebChromeClient()
                  // A download starts as soon as a download link is tapped, like a normal browser.
                  wv.setDownloadListener { url, ua, cd, mime, _ ->
                      queueDownload(url, URLUtil.guessFileName(url, cd, mime), mime ?: "", if (ua.isNullOrBlank()) UA else ua)
                  }
                  root.addView(wv, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 4f))

                  logView = TextView(this)
                  logView.setTextColor(Color.parseColor("#9fe870"))
                  logView.textSize = 11f
                  logView.setPadding(dp(8), dp(4), dp(8), dp(4))
                  logView.setTextIsSelectable(true)
                  logScroll = ScrollView(this)
                  logScroll.addView(logView)
                  root.addView(logScroll, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1.2f))

                  val mp = ViewGroup.LayoutParams.MATCH_PARENT
                  val wc = ViewGroup.LayoutParams.WRAP_CONTENT
                  val frame = FrameLayout(this)
                  frame.addView(root, FrameLayout.LayoutParams(mp, mp))
                  lockLayer = FrameLayout(this)
                  lockLayer.visibility = View.GONE
                  lockLayer.isClickable = true
                  lockLabel = TextView(this)
                  lockLabel.setTextColor(Color.WHITE)
                  lockLabel.textSize = 18f
                  lockLayer.addView(lockLabel, FrameLayout.LayoutParams(wc, wc, Gravity.CENTER))
                  unlockBtn = Button(this)
                  unlockBtn.text = "Unlock"
                  unlockBtn.isAllCaps = false
                  unlockBtn.setOnClickListener { unlockScreen() }
                  lockLayer.addView(unlockBtn, FrameLayout.LayoutParams(wc, wc, Gravity.TOP or Gravity.END))
                  frame.addView(lockLayer, FrameLayout.LayoutParams(mp, mp))
                  setContentView(frame)

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), REQ_NOTIF)
                  }
                  Engine.addListener(engineListener)
                  wv.loadUrl("https://www.google.com")
                  Engine.log("1) Tap 'Select folder' and pick where downloads should be saved.\n2) Open a website and tap a download link. It starts right away.\nZIP files are extracted automatically and the ZIP is deleted.\nDownloads stop when only 1 GB of space is left.")
                  handleAuto(intent)
                  Engine.ensureWorker()
                  refreshLog()
                  refreshStatus()
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  handleAuto(intent)
              }

              override fun onStart() {
                  super.onStart()
                  Engine.appVisible = true
                  Engine.changed(true)
              }

              override fun onResume() {
                  super.onResume()
                  if (!autoBoot) {
                      if (root.visibility != View.VISIBLE) root.visibility = View.VISIBLE
                      if (floating) dock(false)
                  }
                  h.removeCallbacks(ticker)
                  h.post(ticker)
                  refreshStatus()
                  checkPrompts()
              }

              override fun onPause() {
                  super.onPause()
                  h.removeCallbacks(ticker)
              }

              override fun onStop() {
                  super.onStop()
                  Engine.appVisible = false
                  Engine.changed(true)
                  // leaving the app while downloads are active: keep the browser alive in a small side bubble
                  try { if (Engine.hasWork() && !floating && !isFinishing && canOverlay()) startFloat(false, false) } catch (e: Exception) { }
              }

              override fun onDestroy() {
                  Engine.removeListener(engineListener)
                  h.removeCallbacksAndMessages(null)
                  if (instance === this) instance = null
                  if (floating) { try { dock(false) } catch (e: Exception) { } }
                  try { wv.destroy() } catch (e: Exception) { }
                  super.onDestroy()
              }

              override fun onBackPressed() {
                  if (locked) return
                  if (wv.canGoBack()) {
                      wv.goBack()
                  } else if (Engine.hasWork()) {
                      moveTaskToBack(true)
                  } else {
                      super.onBackPressed()
                  }
              }

              // ---------- browser ----------
              private fun go() {
                  val t = address.text.toString().trim()
                  if (t.isEmpty()) return
                  val u = if (t.startsWith("http://", true) || t.startsWith("https://", true)) t
                  else if (t.contains(" ") || !t.contains(".")) "https://www.google.com/search?q=" + Uri.encode(t)
                  else "https://" + t
                  wv.loadUrl(u)
                  address.clearFocus()
              }

              private fun queueDownload(url: String, name: String, mime: String, ua: String) {
                  Engine.enqueue(url, name, mime, ua, wv.url ?: "")
                  refreshStatus()
              }

              private fun unwrap(r: String?): String? {
                  if (r == null || r == "null") return null
                  return try { (JSONTokener(r).nextValue() as? String) ?: r } catch (e: Exception) { r }
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun add(url: String?, title: String?, mime: String?) {
                      val u = url?.trim() ?: return
                      if (!u.startsWith("http://", true) && !u.startsWith("https://", true)) return
                      runOnUiThread {
                          // only accept this from the page while Select mode is on
                          if (selectMode) {
                              val n = (title ?: "").ifBlank { Uri.parse(u).lastPathSegment ?: "download" }.take(150)
                              queueDownload(u, n, mime ?: "", UA)
                          }
                      }
                  }
              }

              private fun toggleSelectMode() {
                  selectMode = !selectMode
                  selBtn?.text = if (selectMode) "Select mode: ON" else "Select mode: OFF"
                  wv.evaluateJavascript(SELECT_JS, null)
                  wv.evaluateJavascript("window.__rbuSelectMode=" + selectMode, null)
                  Engine.log(if (selectMode) "Select mode ON: tap any link on the page to download it." else "Select mode OFF.")
              }

              private fun selectPage() {
                  wv.evaluateJavascript(SELECT_JS, null)
                  wv.evaluateJavascript("window.__rbuCollect?window.__rbuCollect():'[]'") { r ->
                      val raw = unwrap(r) ?: "[]"
                      val arr = try { JSONArray(raw) } catch (e: Exception) { JSONArray() }
                      if (arr.length() == 0) {
                          Engine.log("No downloadable video/ZIP links found on this page. Use Select mode and tap a link, or tap a direct .mp4/.zip link.")
                      } else {
                          AlertDialog.Builder(this)
                              .setTitle("Download from this page")
                              .setMessage("Found " + arr.length() + " downloadable file(s). Download them all now, one after another?")
                              .setPositiveButton("Download all") { _, _ ->
                                  for (i in 0 until arr.length()) {
                                      val o = arr.getJSONObject(i)
                                      queueDownload(o.optString("u"), o.optString("n", "download"), o.optString("m"), UA)
                                  }
                              }
                              .setNegativeButton("Cancel", null)
                              .show()
                      }
                  }
              }

              // ---------- folder ----------
              private fun pickFolder() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT_TREE)
                  i.addFlags(
                      Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION or
                          Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION or Intent.FLAG_GRANT_PREFIX_URI_PERMISSION
                  )
                  try {
                      startActivityForResult(i, REQ_TREE)
                  } catch (e: Exception) {
                      Engine.log("No file picker available on this phone.")
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_TREE && resultCode == RESULT_OK) {
                      val u = data?.data ?: return
                      try {
                          contentResolver.takePersistableUriPermission(
                              u, Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                          )
                      } catch (e: Exception) { }
                      folderPrompted = false
                      Engine.setTree(u)
                      refreshStatus()
                  }
              }

              // ---------- status / log / prompts ----------
              private fun watchdogOn(): Boolean {
                  val v = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
                  return v.contains("com.rbu.folderdl") && v.contains("WatchdogService")
              }

              private fun refreshStatus() {
                  val free = Engine.freeBytes()
                  val usable = maxOf(0L, free - Engine.RESERVE)
                  val sb = StringBuilder()
                  sb.append("Folder: ").append(if (Engine.tree() == null) "NOT CHOSEN - tap Select folder" else Engine.treeName())
                  sb.append("  •  ").append(if (Engine.hasWork()) "DOWNLOADING" else "idle")
                  sb.append("  •  watchdog ").append(if (watchdogOn()) "ON" else "OFF").append('\n')
                  sb.append("Free space: ").append(Engine.fmt(free)).append("  •  usable before 1 GB reserve: ").append(Engine.fmt(usable))
                  var color = Color.WHITE
                  if (free <= Engine.RESERVE) {
                      color = Color.parseColor("#FF5252")
                      sb.append("\nSTOPPED: only ").append(Engine.fmt(free)).append(" left. Downloads are paused.")
                  } else if (free < Engine.WARN) {
                      color = Color.parseColor("#FFB74D")
                      sb.append("\nWarning: less than 2 GB free. Downloads stop when 1 GB is left.")
                  }
                  val act = Engine.activeCount()
                  if (act > 0) {
                      sb.append("\nWaiting/active: ").append(act)
                      val c = Engine.currentItem
                      if (c != null) {
                          sb.append(" • ").append(c.name)
                          if (c.status == "extracting") sb.append(" (extracting)")
                          else if (c.total > 0) sb.append(" ").append(c.done * 100 / c.total).append("%")
                          else sb.append(" ").append(Engine.fmt(c.done))
                      }
                  }
                  val br = Engine.blockReason
                  if (br != null) sb.append('\n').append(br)
                  statusView.text = sb.toString()
                  statusView.setTextColor(color)
              }

              private fun refreshLog() {
                  val v = Engine.logVersion
                  if (v == lastLogVersion) return
                  lastLogVersion = v
                  logView.text = Engine.logSnapshot()
                  logScroll.post { logScroll.fullScroll(View.FOCUS_DOWN) }
              }

              private fun checkPrompts() {
                  if (isFinishing || autoBoot) return
                  if (Engine.tree() == null && Engine.items.any { it.status == "queued" } && !folderPrompted) {
                      folderPrompted = true
                      AlertDialog.Builder(this)
                          .setTitle("Choose a download folder")
                          .setMessage("Pick the folder where your downloads should be saved. Tip: create or pick a sub-folder (Android does not allow choosing the Download root itself).")
                          .setPositiveButton("Select folder") { _, _ -> pickFolder() }
                          .setNegativeButton("Later", null)
                          .show()
                      return
                  }
                  val w = Engine.lastWarning
                  if (w != null && Engine.appVisible && !warnShowing) {
                      Engine.lastWarning = null
                      warnShowing = true
                      AlertDialog.Builder(this)
                          .setTitle("Warning")
                          .setMessage(w)
                          .setPositiveButton("OK", null)
                          .setOnDismissListener { warnShowing = false }
                          .show()
                  }
              }

              // ---------- downloads list ----------
              private fun label(x: Item): String {
                  return when (x.status) {
                      "queued" -> "Waiting"
                      "downloading" -> "Downloading " + (if (x.total > 0) (x.done * 100 / x.total).toString() + "% (" + Engine.fmt(x.done) + " of " + Engine.fmt(x.total) + ")" else Engine.fmt(x.done))
                      "extracting" -> "Extracting... " + Engine.fmt(x.done)
                      "done" -> "Done" + (if (x.detail.isNotEmpty()) " - " + x.detail else "")
                      "failed" -> "FAILED - " + x.detail
                      "canceled" -> "Canceled"
                      else -> x.status
                  }
              }

              private fun showDownloads() {
                  val list = Engine.items.toList().reversed()
                  val lines = if (list.isEmpty()) arrayOf("No downloads yet") else list.map { it.name + "\n   " + label(it) }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Downloads")
                      .setItems(lines) { _, which -> if (list.isNotEmpty()) itemActions(list[which]) }
                      .setPositiveButton("Close", null)
                      .setNeutralButton("Clear finished") { _, _ -> Engine.clearFinished() }
                      .setNegativeButton("Refresh") { _, _ -> showDownloads() }
                      .show()
              }

              private fun itemActions(x: Item) {
                  val opts = when (x.status) {
                      "queued", "downloading", "extracting" -> arrayOf("Cancel this download")
                      "failed", "canceled" -> arrayOf("Retry", "Remove from list")
                      else -> arrayOf("Remove from list")
                  }
                  AlertDialog.Builder(this)
                      .setTitle(x.name)
                      .setMessage(label(x))
                      .setItems(opts) { _, w ->
                          when (opts[w]) {
                              "Cancel this download" -> Engine.cancel(x)
                              "Retry" -> Engine.retry(x)
                              else -> Engine.remove(x)
                          }
                      }
                      .setNegativeButton("Back", null)
                      .show()
              }

              // ---------- lock / dim ----------
              private fun resetBrightness() {
                  val a = window.attributes
                  a.screenBrightness = WindowManager.LayoutParams.BRIGHTNESS_OVERRIDE_NONE
                  window.attributes = a
              }

              private fun lockScreen(dim: Boolean) {
                  locked = true
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  if (dim) {
                      lockLayer.setBackgroundColor(Color.BLACK)
                      lockLabel.text = ""
                      unlockBtn.setTextColor(Color.parseColor("#777777"))
                      unlockBtn.setBackgroundColor(Color.parseColor("#151515"))
                      val a = window.attributes
                      a.screenBrightness = 0.01f
                      window.attributes = a
                  } else {
                      lockLayer.setBackgroundColor(Color.parseColor("#66000000"))
                      lockLabel.text = "🔒 Locked"
                      unlockBtn.setTextColor(Color.WHITE)
                      unlockBtn.setBackgroundColor(Color.parseColor("#CC333333"))
                      resetBrightness()
                  }
                  lockLayer.visibility = View.VISIBLE
              }

              private fun unlockScreen() {
                  locked = false
                  lockLayer.visibility = View.GONE
                  window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  resetBrightness()
              }

              // ---------- floating window ----------
              private fun canOverlay(): Boolean = Settings.canDrawOverlays(this)

              private fun toggleFloat() {
                  if (floating) dock(false) else startFloat()
              }

              private fun makeShield(lp: WindowManager.LayoutParams, wm: WindowManager, box: View): View {
                  val shield = View(this)
                  var downX = 0f
                  var downY = 0f
                  var startX = 0
                  var startY = 0
                  var dragged = false
                  shield.setOnTouchListener { _, ev ->
                      when (ev.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = ev.rawX
                              downY = ev.rawY
                              startX = lp.x
                              startY = lp.y
                              dragged = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = ev.rawX - downX
                              val dy = ev.rawY - downY
                              if (!dragged && (Math.abs(dx) > dp(12) || Math.abs(dy) > dp(12))) dragged = true
                              if (dragged) {
                                  lp.x = startX + dx.toInt()
                                  lp.y = startY + dy.toInt()
                                  try { wm.updateViewLayout(box, lp) } catch (e: Exception) { }
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!dragged) floatTap() else snapToSide(lp, wm, box)
                          }
                      }
                      true
                  }
                  return shield
              }

              private fun floatTap() {
                  val now = android.os.SystemClock.elapsedRealtime()
                  if (now - lastFloatTap > 700) floatTaps = 0
                  lastFloatTap = now
                  floatTaps++
                  if (floatTaps >= 3) {
                      floatTaps = 0
                      h.post { dock(true) }
                  }
              }

              private fun startFloat(moveBack: Boolean = true, prompt: Boolean = true) {
                  if (floating) return
                  if (!canOverlay()) {
                      if (prompt) {
                          Engine.log("Allow 'Display over other apps' for this app on the screen that just opened, then tap Float again.")
                          try {
                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName)))
                          } catch (e: Exception) { }
                      }
                      return
                  }
                  val mp = ViewGroup.LayoutParams.MATCH_PARENT
                  val dm = resources.displayMetrics
                  val wm = applicationContext.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val idx = root.indexOfChild(wv)
                  root.removeView(wv)
                  val ph = TextView(this)
                  ph.text = "Browser is floating as a small bubble.\nTriple-tap the bubble, or press Dock, to bring it back."
                  ph.setTextColor(Color.WHITE)
                  ph.gravity = Gravity.CENTER
                  root.addView(ph, if (idx < 0) root.childCount else idx, LinearLayout.LayoutParams(mp, 0, 4f))
                  placeholder = ph

                  // Bubble is tiny, but the real WebView inside it is kept at a normal working size
                  // and just visually scaled down to fit.
                  val bubblePx = dp(52)
                  val innerPx = dp(360)
                  val innerH = dp(640)
                  val scale = bubblePx.toFloat() / innerPx.toFloat()

                  val box = FrameLayout(this)
                  box.clipChildren = true
                  box.clipToOutline = true
                  box.background = android.graphics.drawable.GradientDrawable().apply {
                      shape = android.graphics.drawable.GradientDrawable.OVAL
                      setColor(Color.parseColor("#9FE870"))
                      setStroke(dp(2), Color.parseColor("#1b5e20"))
                  }
                  box.addView(wv, FrameLayout.LayoutParams(innerPx, innerH))
                  wv.pivotX = 0f
                  wv.pivotY = 0f
                  wv.scaleX = scale
                  wv.scaleY = scale

                  val type = if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE
                  val lp = WindowManager.LayoutParams(
                      bubblePx, bubblePx,
                      type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON or WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  val margin = dp(4)
                  val savedX = Engine.prefs.getInt("bx", dm.widthPixels - bubblePx - margin)
                  lp.x = if (savedX + bubblePx / 2 < dm.widthPixels / 2) margin else dm.widthPixels - bubblePx - margin
                  lp.y = Engine.prefs.getInt("by", (dm.heightPixels * 0.30f).toInt()).coerceIn(dp(40), dm.heightPixels - bubblePx - dp(90))
                  box.addView(makeShield(lp, wm, box), FrameLayout.LayoutParams(mp, mp))
                  wm.addView(box, lp)
                  floatBox = box
                  floating = true
                  floatBtn?.text = "Dock"
                  if (prompt) Engine.log("Floating as a small bubble at the side. Drag it to move it; triple-tap it to open the app.")
                  if (moveBack) h.postDelayed({ moveTaskToBack(true) }, 400)
              }

              private fun dock(openApp: Boolean) {
                  if (!floating) return
                  if (openApp) {
                      try {
                          val i = Intent(this, MainActivity::class.java)
                          i.addFlags(Intent.FLAG_ACTIVITY_REORDER_TO_FRONT or Intent.FLAG_ACTIVITY_NEW_TASK)
                          startActivity(i)
                      } catch (e: Exception) { }
                  }
                  val box = floatBox
                  val wm = applicationContext.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  try { if (box != null) wm.removeView(box) } catch (e: Exception) { }
                  try { box?.removeView(wv) } catch (e: Exception) { }
                  wv.scaleX = 1f
                  wv.scaleY = 1f
                  wv.pivotX = (wv.width / 2).toFloat()
                  wv.pivotY = (wv.height / 2).toFloat()
                  var idx = root.childCount
                  val ph = placeholder
                  if (ph != null) {
                      idx = root.indexOfChild(ph)
                      root.removeView(ph)
                  }
                  if (idx < 0) idx = root.childCount
                  if (wv.parent == null) root.addView(wv, idx, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 4f))
                  floatBox = null
                  placeholder = null
                  floating = false
                  floatBtn?.text = "Float"
              }

              private fun snapToSide(lp: WindowManager.LayoutParams, wm: WindowManager, box: View) {
                  val dm = resources.displayMetrics
                  val size = lp.width
                  val margin = dp(4)
                  lp.x = if (lp.x + size / 2 < dm.widthPixels / 2) margin else dm.widthPixels - size - margin
                  val minY = dp(40)
                  val maxY = dm.heightPixels - size - dp(90)
                  if (lp.y < minY) lp.y = minY
                  if (lp.y > maxY) lp.y = maxY
                  try { wm.updateViewLayout(box, lp) } catch (e: Exception) { }
                  Engine.prefs.edit().putInt("bx", lp.x).putInt("by", lp.y).apply()
              }

              // ---------- auto-revive / background ----------
              private fun handleAuto(i: Intent?) {
                  if (i == null || !i.getBooleanExtra("auto", false)) return
                  autoBoot = true
                  try { root.visibility = View.INVISIBLE } catch (e: Exception) { }
                  Engine.ensureWorker()
                  h.postDelayed({ finishAuto() }, 1200)
              }

              private fun finishAuto() {
                  if (!autoBoot) return
                  autoBoot = false
                  if (Engine.hasWork() && canOverlay()) startFloat(true, false) else moveTaskToBack(true)
              }

              private fun setupWatchdog() {
                  val on = watchdogOn()
                  val msg = if (on) {
                      "The watchdog is ON.\n\nEvery time you open an app it checks the downloader. If it was killed it comes back by itself, continues the downloads and shows the side bubble again."
                  } else {
                      "The watchdog is OFF.\n\n1) Tap 'Open settings'.\n2) Find 'Folder Downloader' and turn it ON. If the switch is greyed out, tap it once, then go to Settings > Apps > Folder Downloader > three dots (top right) > 'Allow restricted settings', and try again.\n\nIt only notices which app opens. It does not read your screen."
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Auto-revive watchdog")
                      .setMessage(msg)
                      .setPositiveButton("Open settings") { _, _ ->
                          try { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) } catch (e: Exception) { }
                      }
                      .setNegativeButton("Close", null)
                      .show()
              }

              private fun batterySetting() {
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (pm.isIgnoringBatteryOptimizations(packageName)) {
                          Engine.log("Battery: already unrestricted for this app.")
                      } else {
                          val i = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)
                          i.data = Uri.parse("package:" + packageName)
                          startActivity(i)
                          Engine.log("Allow 'unrestricted battery use' on the screen that just opened.")
                      }
                  } catch (e: Exception) { }
              }
          }
