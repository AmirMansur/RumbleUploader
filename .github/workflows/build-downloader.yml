          cat > app/src/main/java/com/rbu/folderdl/DownloadService.kt <<'RBU_EOF'
          package com.rbu.folderdl

          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager

          // Keeps the app alive in the background (notification + wake locks) while downloads are waiting.
          class DownloadService : Service() {
              private var wake: PowerManager.WakeLock? = null
              private var wifi: WifiManager.WifiLock? = null
              private val listener: () -> Unit = { refresh() }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  Engine.init(this)
                  startFg()
                  try {
                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "fdl:svc")
                      wake?.acquire(12 * 60 * 60 * 1000L)
                  } catch (e: Exception) { }
                  try {
                      val w = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                      val l = w.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "fdl:wifi")
                      l.setReferenceCounted(false)
                      l.acquire()
                      wifi = l
                  } catch (e: Exception) { }
                  Engine.addListener(listener)
              }

              private fun startFg() {
                  val n = Notifier.running(this, Engine.summary())
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(Notifier.ID_RUN, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                      } else {
                          startForeground(Notifier.ID_RUN, n)
                      }
                  } catch (e: Exception) { }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  Engine.init(this)
                  startFg()
                  // intent == null means Android restarted this service after killing the app
                  if (intent == null) {
                      try { Revive.ensure(applicationContext) } catch (e: Exception) { }
                  }
                  Engine.ensureWorker()
                  refresh()
                  return START_STICKY
              }

              private fun refresh() {
                  if (!Engine.hasWork() && !Engine.workerRunning) {
                      try { stopForeground(true) } catch (e: Exception) { }
                      stopSelf()
                      return
                  }
                  Notifier.update(this, Engine.summary())
              }

              override fun onDestroy() {
                  Engine.removeListener(listener)
                  try { if (wake?.isHeld == true) wake?.release() } catch (e: Exception) { }
                  try { if (wifi?.isHeld == true) wifi?.release() } catch (e: Exception) { }
                  super.onDestroy()
              }
          }
