          package com.rbu.folderdl

          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.os.StatFs
          import android.os.SystemClock
          import android.provider.DocumentsContract
          import android.webkit.CookieManager
          import android.webkit.MimeTypeMap
          import android.webkit.URLUtil
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedInputStream
          import java.io.InputStream
          import java.io.OutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.CopyOnWriteArrayList
          import java.util.zip.ZipInputStream

          class CancelException : Exception("Canceled")
          class SpaceException(m: String) : Exception(m)

          class Item(
              val id: String,
              val url: String,
              var name: String,
              var mime: String,
              val ua: String,
              val cookie: String,
              val referer: String
          ) {
              // queued, downloading, extracting, done, failed, canceled
              @Volatile var status = "queued"
              @Volatile var detail = ""
              @Volatile var done = 0L
              @Volatile var total = -1L
              @Volatile var cancel = false
              @Volatile var partUri = ""
          }

          object Engine {
              const val RESERVE = 1024L * 1024L * 1024L      // downloads stop when free space reaches 1 GB
              const val WARN = 2048L * 1024L * 1024L         // warning shown below 2 GB
              const val DEFAULT_UA = "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"

              lateinit var app: Context
              lateinit var prefs: SharedPreferences
              private var inited = false

              val items = CopyOnWriteArrayList<Item>()
              @Volatile var blockReason: String? = null
              @Volatile var appVisible = false
              @Volatile var workerRunning = false
              @Volatile var lastWarning: String? = null
              @Volatile var currentItem: Item? = null
              private var lowWarned = false

              private val logBuf = StringBuilder()
              @Volatile var logVersion = 0

              fun log(m: String) {
                  synchronized(logBuf) {
                      logBuf.append(m).append('\n')
                      if (logBuf.length > 30000) logBuf.delete(0, logBuf.length - 20000)
                      logVersion++
                  }
                  changed(true)
              }

              fun logSnapshot(): String = synchronized(logBuf) { logBuf.toString() }

              fun clearLog() {
                  synchronized(logBuf) {
                      logBuf.setLength(0)
                      logVersion++
                  }
                  changed(true)
              }

              private val main = Handler(Looper.getMainLooper())
              private val listeners = CopyOnWriteArrayList<() -> Unit>()
              private var lastNotify = 0L

              @Synchronized
              fun init(ctx: Context) {
                  if (inited) return
                  app = ctx.applicationContext
                  prefs = app.getSharedPreferences("fdl", Context.MODE_PRIVATE)
                  inited = true
                  load()
              }

              // ---------- listeners ----------
              fun addListener(l: () -> Unit) { if (!listeners.contains(l)) listeners.add(l) }
              fun removeListener(l: () -> Unit) { listeners.remove(l) }

              fun changed(force: Boolean = false) {
                  val now = SystemClock.elapsedRealtime()
                  if (!force && now - lastNotify < 400) return
                  lastNotify = now
                  main.post {
                      for (l in listeners) {
                          try { l() } catch (e: Exception) { }
                      }
                  }
              }

              fun warn(msg: String) {
                  log("⚠ " + msg)
                  lastWarning = msg
                  try { Notifier.warn(app, msg) } catch (e: Exception) { }
                  changed(true)
              }

              // ---------- folder + space ----------
              fun tree(): Uri? {
                  val s = prefs.getString("tree", null) ?: return null
                  return try { Uri.parse(s) } catch (e: Exception) { null }
              }

              fun setTree(u: Uri) {
                  prefs.edit().putString("tree", u.toString()).apply()
                  lowWarned = false
                  log("Download folder: " + treeName())
                  changed(true)
                  ensureWorker()
              }

              fun treeName(): String {
                  val t = tree() ?: return "(none)"
                  return try {
                      val doc = DocumentsContract.buildDocumentUriUsingTree(t, DocumentsContract.getTreeDocumentId(t))
                      val name: String? = app.contentResolver.query(doc, arrayOf(DocumentsContract.Document.COLUMN_DISPLAY_NAME), null, null, null)?.use { c ->
                          if (c.moveToFirst()) c.getString(0) else null
                      }
                      name ?: "(folder)"
                  } catch (e: Exception) { "(folder)" }
              }

              fun freeBytes(): Long {
                  try {
                      val t = tree()
                      val vol = if (t != null) DocumentsContract.getTreeDocumentId(t).substringBefore(':') else "primary"
                      if (vol != "primary") {
                          for (f in app.getExternalFilesDirs(null)) {
                              if (f != null && f.absolutePath.contains("/" + vol + "/")) {
                                  return StatFs(f.absolutePath).availableBytes
                              }
                          }
                      }
                      return StatFs(Environment.getExternalStorageDirectory().absolutePath).availableBytes
                  } catch (e: Exception) {
                      return try { StatFs(app.filesDir.absolutePath).availableBytes } catch (e2: Exception) { 0L }
                  }
              }

              fun fmt(b: Long): String {
                  if (b < 0L) return "?"
                  val mb = b / 1048576.0
                  return if (mb >= 1024.0) String.format(java.util.Locale.US, "%.2f GB", mb / 1024.0)
                  else String.format(java.util.Locale.US, "%.1f MB", mb)
              }

              // ---------- queue ----------
              fun hasWork(): Boolean = items.any { it.status == "queued" || it.status == "downloading" || it.status == "extracting" }

              fun activeCount(): Int = items.count { it.status == "queued" || it.status == "downloading" || it.status == "extracting" }

              fun enqueue(url: String, name: String, mime: String, ua: String, referer: String) {
                  if (!url.startsWith("http://", true) && !url.startsWith("https://", true)) {
                      warn("This kind of link (" + url.substringBefore(':') + ":) is created inside the page and can't be downloaded by this app. Look for a normal download link on the site.")
                      return
                  }
                  if (items.any { it.url == url && (it.status == "queued" || it.status == "downloading" || it.status == "extracting") }) return
                  val cookie = cookieFor(url, "")
                  val item = Item(System.currentTimeMillis().toString() + "_" + items.size, url, name, mime, ua, cookie, referer)
                  items.add(item)
                  log("⬇ added: " + name)
                  trim()
                  save()
                  changed(true)
                  ensureWorker()
              }

              fun cancel(item: Item) {
                  item.cancel = true
                  if (item.status == "queued") {
                      item.status = "canceled"
                      item.detail = "Canceled"
                  }
                  save()
                  changed(true)
              }

              fun retry(item: Item) {
                  if (item.status == "failed" || item.status == "canceled") {
                      item.status = "queued"
                      item.detail = ""
                      item.cancel = false
                      item.done = 0L
                      save()
                      changed(true)
                      ensureWorker()
                  }
              }

              fun remove(item: Item) {
                  if (item.status == "queued" || item.status == "downloading" || item.status == "extracting") return
                  items.remove(item)
                  save()
                  changed(true)
              }

              fun clearFinished() {
                  items.removeAll { it.status == "done" || it.status == "failed" || it.status == "canceled" }
                  save()
                  changed(true)
              }

              private fun trim() {
                  while (items.size > 200) {
                      val old = items.firstOrNull { it.status == "done" || it.status == "failed" || it.status == "canceled" } ?: break
                      items.remove(old)
                  }
              }

              fun summary(): String {
                  val left = activeCount()
                  val c = currentItem
                  val head = if (c != null && c.status == "extracting") {
                      "Extracting " + c.name
                  } else if (c != null) {
                      "Downloading " + (if (c.total > 0) (c.done * 100 / c.total).toString() + "%" else fmt(c.done))
                  } else if (blockReason != null) {
                      "Paused"
                  } else {
                      "Idle"
                  }
                  return head + " • " + left + " left • " + fmt(freeBytes()) + " free"
              }

              // ---------- persistence ----------
              fun save() {
                  try {
                      val a = JSONArray()
                      for (x in items) {
                          a.put(
                              JSONObject().put("id", x.id).put("url", x.url).put("name", x.name).put("mime", x.mime)
                                  .put("ua", x.ua).put("cookie", x.cookie).put("referer", x.referer)
                                  .put("status", x.status).put("detail", x.detail).put("part", x.partUri)
                          )
                      }
                      prefs.edit().putString("items", a.toString()).apply()
                  } catch (e: Exception) { }
              }

              private fun load() {
                  try {
                      val a = JSONArray(prefs.getString("items", "[]"))
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val x = Item(o.getString("id"), o.getString("url"), o.optString("name"), o.optString("mime"),
                              o.optString("ua"), o.optString("cookie"), o.optString("referer"))
                          x.status = o.optString("status", "queued")
                          x.detail = o.optString("detail")
                          x.partUri = o.optString("part")
                          if (x.status == "downloading") {
                              if (x.partUri.isNotEmpty()) deleteQuiet(Uri.parse(x.partUri))
                              x.partUri = ""
                              x.status = "queued"
                              x.detail = "Restarted after interruption"
                          } else if (x.status == "extracting") {
                              x.status = "failed"
                              x.detail = "Interrupted while extracting. The ZIP was kept in your folder."
                          }
                          items.add(x)
                      }
                  } catch (e: Exception) { }
              }

              // ---------- worker ----------
              fun ensureRunning(ctx: Context) {
                  init(ctx)
                  if (hasWork()) {
                      ensureWorker()
                      startService()
                  }
              }

              fun startService() {
                  try {
                      val i = Intent(app, DownloadService::class.java)
                      if (Build.VERSION.SDK_INT >= 26) app.startForegroundService(i) else app.startService(i)
                  } catch (e: Exception) { }
              }

              @Synchronized
              fun ensureWorker() {
                  if (workerRunning) return
                  if (items.none { it.status == "queued" }) return
                  workerRunning = true
                  startService()
                  Thread {
                      try {
                          loop()
                      } catch (e: Throwable) {
                      } finally {
                          workerRunning = false
                          currentItem = null
                          blockReason = null
                          changed(true)
                          if (items.any { it.status == "queued" }) ensureWorker()
                      }
                  }.start()
              }

              private fun sleepMs(ms: Long) {
                  try { Thread.sleep(ms) } catch (e: InterruptedException) { }
              }

              private fun loop() {
                  while (true) {
                      val item = items.firstOrNull { it.status == "queued" } ?: return
                      // wait until a folder is chosen and there is enough free space
                      while (item.status == "queued") {
                          if (tree() == null) {
                              blockReason = "Choose a download folder first (Folder button)."
                              changed()
                              sleepMs(2000)
                              continue
                          }
                          val free = freeBytes()
                          if (free <= RESERVE) {
                              blockReason = "STOPPED: only " + fmt(free) + " free. Downloads are paused until more than 1 GB is free."
                              if (!lowWarned) {
                                  lowWarned = true
                                  warn("Storage is almost full: only " + fmt(free) + " is left. Downloads are stopped to keep 1 GB free. Free up space (or choose another folder) and they will continue automatically.")
                              }
                              changed()
                              sleepMs(3000)
                              continue
                          }
                          lowWarned = false
                          blockReason = null
                          break
                      }
                      if (item.status != "queued") continue
                      runItem(item)
                  }
              }

              private fun runItem(item: Item) {
                  currentItem = item
                  item.status = "downloading"
                  item.detail = ""
                  item.done = 0L
                  item.total = -1L
                  item.cancel = false
                  save()
                  changed(true)

                  log("▶ " + item.name)
                  val saved = download(item)
                  if (saved != null) {
                      val lower = item.name.lowercase()
                      if (lower.endsWith(".zip") || item.mime.contains("zip")) {
                          try {
                              val n = extractZip(item, saved)
                              if (n > 0) {
                                  val deleted = deleteQuiet(saved)
                                  item.status = "done"
                                  item.detail = "Extracted " + n + " file(s) into a folder; " + (if (deleted) "ZIP deleted to save space." else "could not delete the ZIP.")
                              } else {
                                  item.status = "done"
                                  item.detail = "The ZIP had no files inside; it was kept."
                              }
                          } catch (e: CancelException) {
                              item.status = "canceled"
                              item.detail = "Canceled while extracting. The ZIP was kept."
                          } catch (e: SpaceException) {
                              item.status = "failed"
                              item.detail = (e.message ?: "Not enough space") + " The ZIP was kept."
                              warn(item.detail)
                          } catch (e: Throwable) {
                              item.status = "failed"
                              item.detail = "Extraction failed: " + (e.message ?: e.toString()) + ". The ZIP was kept."
                          }
                      } else if (lower.endsWith(".rar") || lower.endsWith(".7z")) {
                          item.status = "done"
                          item.detail = "Saved. RAR / 7Z files can't be extracted by this app."
                      } else {
                          item.status = "done"
                      }
                  }
                  when (item.status) {
                      "done" -> {
                          log("  ✔ done: " + item.name + (if (item.detail.isNotEmpty()) " — " + item.detail else ""))
                          prefs.edit().putInt("revive_n", 0).apply()
                      }
                      "failed" -> log("  ✖ failed: " + item.name + " — " + item.detail)
                      "canceled" -> log("  ■ canceled: " + item.name)
                  }
                  currentItem = null
                  save()
                  changed(true)
              }

              // ---------- download ----------
              private fun download(item: Item): Uri? {
                  var part: Uri? = null
                  var conn: HttpURLConnection? = null
                  try {
                      val t = tree() ?: throw Exception("No download folder selected")
                      val parent = DocumentsContract.buildDocumentUriUsingTree(t, DocumentsContract.getTreeDocumentId(t))
                      val c = open(item)
                      conn = c
                      val code = c.responseCode
                      if (code !in 200..299) throw Exception("Server answered HTTP " + code)
                      val len = c.contentLengthLong
                      item.total = len
                      val ctype = (c.contentType ?: "").substringBefore(';').trim().lowercase()
                      val cd = c.getHeaderField("Content-Disposition")
                      var name = if (cd != null) URLUtil.guessFileName(item.url, cd, ctype) else item.name
                      name = safe(name)
                      if (!name.contains('.')) {
                          val ext = MimeTypeMap.getSingleton().getExtensionFromMimeType(ctype) ?: ""
                          if (ext.isNotEmpty()) name = name + "." + ext
                      }
                      val ln = name.lowercase()
                      if (ctype.startsWith("text/html") && !ln.endsWith(".html") && !ln.endsWith(".htm")) {
                          throw Exception("The link returned a web page, not a file. Sign in on the site first, or use the file's own download link.")
                      }
                      item.name = name
                      item.mime = ctype
                      log("  " + name + (if (len > 0) " (" + fmt(len) + ")" else "") + " — saving to your folder")
                      if (len > 0) {
                          val free = freeBytes()
                          if (free - len < RESERVE) {
                              throw SpaceException("Not enough space: this file needs " + fmt(len) + " but only " + fmt(maxOf(0L, free - RESERVE)) + " is usable (1 GB is always kept free).")
                          }
                      }
                      val resolver = app.contentResolver
                      val p = DocumentsContract.createDocument(resolver, parent, "application/octet-stream", name + ".part")
                          ?: throw Exception("Could not create a file in the chosen folder. Choose the folder again.")
                      part = p
                      item.partUri = p.toString()
                      save()
                      val out = resolver.openOutputStream(p, "w") ?: throw Exception("Could not open the file for writing")
                      c.inputStream.use { ins ->
                          out.use { o -> copyChecked(item, ins, o) }
                      }
                      if (len > 0 && item.done != len) {
                          throw Exception("Connection ended early (got " + fmt(item.done) + " of " + fmt(len) + ")")
                      }
                      val renamed = DocumentsContract.renameDocument(resolver, p, name)
                      item.partUri = ""
                      if (renamed == null) {
                          item.detail = "Saved as " + name + ".part (could not rename)"
                          part = null
                          return p
                      }
                      part = null
                      return renamed
                  } catch (e: CancelException) {
                      item.status = "canceled"
                      item.detail = "Canceled"
                      deleteQuiet(part)
                  } catch (e: SpaceException) {
                      item.status = "failed"
                      item.detail = e.message ?: "Not enough space"
                      deleteQuiet(part)
                      warn(item.detail)
                  } catch (e: Throwable) {
                      item.status = "failed"
                      item.detail = e.message ?: e.toString()
                      deleteQuiet(part)
                  } finally {
                      try { conn?.disconnect() } catch (e: Exception) { }
                      item.partUri = ""
                  }
                  return null
              }

              private fun copyChecked(item: Item, ins: InputStream, out: OutputStream) {
                  val buf = ByteArray(128 * 1024)
                  var last = SystemClock.elapsedRealtime()
                  var lastLog = last
                  while (true) {
                      if (item.cancel) throw CancelException()
                      val n = ins.read(buf)
                      if (n < 0) break
                      out.write(buf, 0, n)
                      item.done += n
                      val now = SystemClock.elapsedRealtime()
                      if (now - last > 1500) {
                          last = now
                          val free = freeBytes()
                          if (free <= RESERVE) {
                              throw SpaceException("Stopped: free space reached the 1 GB reserve (" + fmt(free) + " left). The unfinished file was removed.")
                          }
                          if (now - lastLog > 20000) {
                              lastLog = now
                              if (item.status == "extracting") log("  extracted so far: " + fmt(item.done) + " • " + fmt(free) + " free")
                              else log("  downloading " + (if (item.total > 0) (item.done * 100 / item.total).toString() + "%" else fmt(item.done)) + " • " + fmt(free) + " free")
                          }
                          changed()
                      }
                  }
              }

              private fun open(item: Item): HttpURLConnection {
                  var u = item.url
                  var hops = 0
                  while (true) {
                      val c = URL(u).openConnection() as HttpURLConnection
                      c.instanceFollowRedirects = false
                      c.connectTimeout = 20000
                      c.readTimeout = 30000
                      c.setRequestProperty("User-Agent", if (item.ua.isBlank()) DEFAULT_UA else item.ua)
                      if (item.referer.isNotBlank()) c.setRequestProperty("Referer", item.referer)
                      val ck = cookieFor(u, item.cookie)
                      if (ck.isNotBlank()) c.setRequestProperty("Cookie", ck)
                      c.setRequestProperty("Accept-Encoding", "identity")
                      val code = c.responseCode
                      if (code == 301 || code == 302 || code == 303 || code == 307 || code == 308) {
                          val loc = c.getHeaderField("Location") ?: return c
                          c.disconnect()
                          u = URL(URL(u), loc).toString()
                          hops++
                          if (hops > 8) throw Exception("Too many redirects")
                          continue
                      }
                      return c
                  }
              }

              private fun cookieFor(url: String, fallback: String): String {
                  return try { CookieManager.getInstance().getCookie(url) ?: fallback } catch (e: Throwable) { fallback }
              }

              // ---------- ZIP extraction ----------
              private fun extractZip(item: Item, zipUri: Uri): Int {
                  item.status = "extracting"
                  item.detail = "Extracting..."
                  log("  extracting ZIP, then it will be deleted to save space...")
                  item.done = 0L
                  item.total = -1L
                  save()
                  changed(true)
                  val resolver = app.contentResolver
                  val t = tree() ?: throw Exception("No download folder selected")
                  val root = DocumentsContract.buildDocumentUriUsingTree(t, DocumentsContract.getTreeDocumentId(t))
                  val base = item.name.substringBeforeLast('.', item.name)
                  val folder = DocumentsContract.createDocument(resolver, root, DocumentsContract.Document.MIME_TYPE_DIR, safe(base))
                      ?: throw Exception("Could not create the extraction folder")
                  val dirs = HashMap<String, Uri>()
                  var count = 0
                  var ok = false
                  try {
                      val raw = resolver.openInputStream(zipUri) ?: throw Exception("Could not read the ZIP")
                      ZipInputStream(BufferedInputStream(raw, 1 shl 16)).use { zis ->
                          var e = zis.nextEntry
                          while (e != null) {
                              if (item.cancel) throw CancelException()
                              val rawName = e.name.replace('\\', '/')
                              val parts = rawName.split('/').filter { it.isNotEmpty() && it != "." && it != ".." }
                              if (parts.isNotEmpty() && !rawName.startsWith("__MACOSX/") && !parts.last().startsWith("._")) {
                                  val dirParts = if (e.isDirectory) parts else parts.dropLast(1)
                                  var dirUri = folder
                                  var key = ""
                                  for (p in dirParts) {
                                      key = if (key.isEmpty()) p else key + "/" + p
                                      val parentUri = dirUri
                                      dirUri = dirs.getOrPut(key) {
                                          DocumentsContract.createDocument(resolver, parentUri, DocumentsContract.Document.MIME_TYPE_DIR, safe(p))
                                              ?: throw Exception("Could not create folder " + p)
                                      }
                                  }
                                  if (!e.isDirectory) {
                                      val sz = e.size
                                      if (sz > 0 && freeBytes() - sz < RESERVE) {
                                          throw SpaceException("Not enough space to extract. Free space would drop below the 1 GB reserve.")
                                      }
                                      val fname = safe(parts.last())
                                      val ext = fname.substringAfterLast('.', "").lowercase()
                                      val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext) ?: "application/octet-stream"
                                      val doc = DocumentsContract.createDocument(resolver, dirUri, mime, fname)
                                          ?: throw Exception("Could not create " + fname)
                                      val o = resolver.openOutputStream(doc, "w") ?: throw Exception("Could not write " + fname)
                                      o.use { copyChecked(item, zis, it) }
                                      count++
                                      changed()
                                  }
                              }
                              e = zis.nextEntry
                          }
                      }
                      ok = count > 0
                  } finally {
                      if (!ok) deleteQuiet(folder)
                  }
                  return count
              }

              // ---------- helpers ----------
              private fun safe(s: String): String {
                  val c = s.replace(Regex("[\\\\/:*?\"<>|]"), "_").trim().trim('.')
                  return (if (c.isEmpty()) "file" else c).take(150)
              }

              private fun deleteQuiet(u: Uri?): Boolean {
                  if (u == null) return false
                  return try { DocumentsContract.deleteDocument(app.contentResolver, u) } catch (e: Exception) { false }
              }
          }
