          cat > app/src/main/java/com/rbu/folderdl/Revive.kt <<'RBU_EOF'
          package com.rbu.folderdl

          import android.content.Context
          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock

          // Brings the downloader back if it was killed while downloads were still waiting.
          object Revive {
              @Volatile private var lastTry = 0L

              fun ensure(ctx: Context) {
                  Engine.init(ctx)
                  if (!Engine.hasWork()) return
                  // the download engine itself keeps going even without the screen
                  Engine.ensureWorker()
                  Engine.startService()
                  // the app screen exists (it is starting up or running) - nothing to bring back
                  if (MainActivity.instance != null) return
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastTry < 30000) return
                  lastTry = now
                  val p = Engine.prefs
                  val n = p.getInt("revive_n", 0)
                  if (n >= 5) {
                      Notifier.warn(ctx, "It could not restart by itself. Tap to continue.")
                      return
                  }
                  p.edit().putInt("revive_n", n + 1).apply()
                  try {
                      val i = Intent(ctx, MainActivity::class.java)
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                      i.putExtra("auto", true)
                      ctx.startActivity(i)
                  } catch (e: Exception) { }
                  // If Android refused to start it from the background, leave a tap-to-continue notification.
                  Handler(Looper.getMainLooper()).postDelayed({
                      if (Engine.hasWork() && MainActivity.instance == null) {
                          Notifier.warn(ctx, "The downloader was closed. Tap to continue.")
                      }
                  }, 8000)
              }
          }
