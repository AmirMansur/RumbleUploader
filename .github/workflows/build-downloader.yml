          package com.rbu.folderdl

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Build

          object Notifier {
              const val CH_RUN = "fdl_run"
              const val CH_WARN = "fdl_warn"
              const val ID_RUN = 1
              const val ID_WARN = 2

              private fun channels(ctx: Context) {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val nm = ctx.getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(NotificationChannel(CH_RUN, "Downloads", NotificationManager.IMPORTANCE_LOW))
                      nm.createNotificationChannel(NotificationChannel(CH_WARN, "Warnings", NotificationManager.IMPORTANCE_HIGH))
                  }
              }

              private fun builder(ctx: Context, ch: String): Notification.Builder =
                  if (Build.VERSION.SDK_INT >= 26) Notification.Builder(ctx, ch) else Notification.Builder(ctx)

              private fun openIntent(ctx: Context): PendingIntent {
                  val i = Intent(ctx, MainActivity::class.java)
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                  return PendingIntent.getActivity(ctx, 10, i, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
              }

              fun running(ctx: Context, text: String): Notification {
                  channels(ctx)
                  return builder(ctx, CH_RUN)
                      .setContentTitle("Folder Downloader")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.stat_sys_download)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setContentIntent(openIntent(ctx))
                      .build()
              }

              fun update(ctx: Context, text: String) {
                  try {
                      ctx.getSystemService(NotificationManager::class.java).notify(ID_RUN, running(ctx, text))
                  } catch (e: Exception) { }
              }

              fun warn(ctx: Context, text: String) {
                  try {
                      channels(ctx)
                      val n = builder(ctx, CH_WARN)
                          .setContentTitle("Folder Downloader")
                          .setContentText(text)
                          .setStyle(Notification.BigTextStyle().bigText(text))
                          .setSmallIcon(android.R.drawable.stat_sys_warning)
                          .setAutoCancel(true)
                          .setContentIntent(openIntent(ctx))
                          .build()
                      ctx.getSystemService(NotificationManager::class.java).notify(ID_WARN, n)
                  } catch (e: Exception) { }
              }
          }
