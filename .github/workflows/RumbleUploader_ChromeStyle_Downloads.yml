          package com.rbu.uploader

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class ControlReceiver : BroadcastReceiver() {
              override fun onReceive(ctx: Context, intent: Intent) {
                  if (intent.action == Notifier.ACTION_STOP) {
                      ctx.getSharedPreferences("rbu", Context.MODE_PRIVATE).edit().putBoolean("run_wanted", false).apply()
                      val a = MainActivity.instance
                      if (a != null) {
                          a.runOnUiThread { a.stopFromNotification() }
                      } else {
                          try { ctx.stopService(Intent(ctx, RbuService::class.java)) } catch (e: Exception) { }
                      }
                  }
              }
          }
