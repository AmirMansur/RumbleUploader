              inner class Bridge {
                  @JavascriptInterface fun add(url: String?, title: String?, mime: String?) {
                      val u = url?.trim() ?: return
                      if (!u.startsWith("http://", true) && !u.startsWith("https://", true)) return
                      runOnUiThread {
                          val key = sha(u)
                          if (items.none { it.key == key } && !isPreviouslyCompleted(key)) {
                              val n = (title ?: "").ifBlank { Uri.parse(u).lastPathSegment ?: "download" }.take(180)
                              items.add(Item(key,u,n,mime ?: ""))
                              saveQueue(); updateStatus("Added: $n")
                          } else updateStatus("Already in queue/completed")
                      }
                  }
              }
          
              private fun sha(v: String): String = MessageDigest.getInstance("SHA-256").digest(v.toByteArray()).joinToString("") { "%02x".format(it) }
              private fun isPreviouslyCompleted(key: String): Boolean = prefs.getStringSet("dl_uploaded_keys", emptySet())?.contains(key) == true
          
              private fun loadQueue() {
                  try {
                      val a = JSONArray(prefs.getString("dl_queue", "[]"))
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          items.add(Item(o.optString("key"),o.optString("url"),o.optString("name"),o.optString("mime"),o.optString("status","queued"),o.optString("cookie"),o.optString("userAgent"),o.optString("referer")))
                      }
                  } catch (_: Exception) { }
              }
          
              private fun saveQueue() {
                  val a = JSONArray()
                  items.forEach { x -> a.put(JSONObject().put("key",x.key).put("url",x.url).put("name",x.name).put("mime",x.mime).put("status",x.status).put("cookie",x.cookie).put("userAgent",x.userAgent).put("referer",x.referer)) }
                  prefs.edit().putString("dl_queue",a.toString()).apply()
              }
          
              private fun freeBytes(): Long = try { StatFs(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS)?.absolutePath ?: filesDir.absolutePath).availableBytes } catch (_: Exception) { StatFs(filesDir.absolutePath).availableBytes }
          
              private fun startQueue() {
                  if (running) { updateStatus("A download is already running"); return }
                  if (freeBytes() < reserveBytes) { updateStatus("Not enough free space. Need at least 512 MB free."); return }
                  running = true
                  pauseAfterCurrent = false
                  prefs.edit().putBoolean("dl_running",true).apply()
                  startNext()
              }
          
              private fun startNext() {
                  if (!running || pauseAfterCurrent) { running = false; prefs.edit().putBoolean("dl_running",false).apply(); updateStatus("Paused. Tap Resume to continue."); return }
                  if (freeBytes() < reserveBytes) { running = false; prefs.edit().putBoolean("dl_running",false).apply(); updateStatus("Paused: storage safety reserve reached."); return }
                  val item = items.firstOrNull { it.status == "queued" }
                  if (item == null) { running = false; prefs.edit().putBoolean("dl_running",false).apply(); updateStatus("Download queue finished."); return }
                  try {
                      val uri = Uri.parse(item.url)
                      val urlName = uri.lastPathSegment ?: ""
                      val preferred = if (item.name.contains(Regex("\\.[A-Za-z0-9]{2,8}$"))) item.name else if (urlName.contains(Regex("\\.[A-Za-z0-9]{2,8}$"))) urlName else item.name
                      val fileName = safeName(addKnownExtension(preferred, item.mime, urlName))
                      val req = DownloadManager.Request(uri)
                          .setTitle(fileName)
                          .setDescription("Rumble Batch Uploader download queue")
                          .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                          // Strictly use the phone's cellular/mobile network for file payloads.
                          // This prevents the download queue from consuming Wi-Fi data.
                          .setAllowedNetworkTypes(DownloadManager.Request.NETWORK_MOBILE)
                          .setAllowedOverMetered(true)
                          .setAllowedOverRoaming(false)
                          .setDestinationInExternalFilesDir(this,Environment.DIRECTORY_DOWNLOADS,fileName)
                      val cookie = item.cookie.ifBlank { CookieManager.getInstance().getCookie(item.url) ?: "" }
                      if (cookie.isNotBlank()) req.addRequestHeader("Cookie", cookie)
                      val agent = item.userAgent.ifBlank { WebSettings.getDefaultUserAgent(this) }
                      if (agent.isNotBlank()) req.addRequestHeader("User-Agent", agent)
                      val referer = item.referer.ifBlank { web.url ?: "" }
                      if (referer.isNotBlank()) req.addRequestHeader("Referer", referer)
                      activeKey = item.key
                      activeDownload = dm.enqueue(req)
                      item.status = "downloading"
                      prefs.edit().putLong("dl_active_id",activeDownload).putString("dl_active_key",activeKey).putBoolean("dl_running",true).apply()
                      saveQueue(); updateStatus("Downloading: ${item.name}")
                      pollActive()
                  } catch (e: Exception) {
                      item.status = "failed"; saveQueue(); updateStatus("Could not start ${item.name}: ${e.message}"); startNext()
                  }
              }
          
              private fun pollActive() {
                  if (activeDownload <= 0) { startNext(); return }
                  val c: Cursor? = try { dm.query(DownloadManager.Query().setFilterById(activeDownload)) } catch (_: Exception) { null }
                  var statusCode = -1; var reason = 0
                  c?.use { if (it.moveToFirst()) { statusCode = it.getInt(it.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS)); reason = it.getInt(it.getColumnIndexOrThrow(DownloadManager.COLUMN_REASON)) } }
                  when (statusCode) {
                      DownloadManager.STATUS_SUCCESSFUL -> {
                          val uri = dm.getUriForDownloadedFile(activeDownload)
                          val item = items.firstOrNull { it.key == activeKey }
                          if (uri != null && item != null) {
                              val resolvedMime = queryMime(activeDownload).ifBlank { item.mime }
                              val urlName = Uri.parse(item.url).lastPathSegment ?: ""
                              val resolvedName = addKnownExtension(item.name, resolvedMime, urlName)
                              item.status = "handed_off"
                              val stable = "download:" + item.key
                              val main = Intent(this,MainActivity::class.java).apply {
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                                  putExtra("rbu_download_uri",uri.toString())
                                  putExtra("rbu_download_id",stable)
                                  putExtra("rbu_download_name",resolvedName)
                                  putExtra("rbu_download_mime",resolvedMime)
                              }
                              if (MainActivity.instance != null) MainActivity.instance?.acceptDownloadedFile(stable,uri,resolvedName,resolvedMime)
                              else startActivity(main)
                              saveQueue()
                          } else if (item != null) { item.status = "failed"; saveQueue() }
                          activeDownload = -1L; activeKey = ""
                          prefs.edit().remove("dl_active_id").remove("dl_active_key").apply()
                          if (pauseAfterCurrent) { running = false; prefs.edit().putBoolean("dl_running",false).apply(); updateStatus("Paused after current download") }
                          else h.postDelayed({ startNext() },500)
                      }
                      DownloadManager.STATUS_FAILED -> {
                          items.firstOrNull { it.key == activeKey }?.status = "failed"
                          saveQueue(); activeDownload = -1L; activeKey = ""
                          prefs.edit().remove("dl_active_id").remove("dl_active_key").apply()
                          updateStatus("Download failed (reason $reason). It remains available for retry.")
                          h.postDelayed({ startNext() },1200)
                      }
                      DownloadManager.STATUS_PENDING, DownloadManager.STATUS_RUNNING, DownloadManager.STATUS_PAUSED -> {
                          var downloaded = 0L
                          var total = -1L
                          try {
                              dm.query(DownloadManager.Query().setFilterById(activeDownload))?.use { q ->
                                  if (q.moveToFirst()) {
                                      downloaded = q.getLong(q.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR))
                                      total = q.getLong(q.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES))
                                  }
                              }
                          } catch (_: Exception) { }
                          val progress = if (total > 0) " • ${downloaded * 100 / total}% (${formatBytes(downloaded)} / ${formatBytes(total)})" else " • ${formatBytes(downloaded)}"
                          updateStatus("Downloading$progress")
                          h.postDelayed({ pollActive() },1500)
                      }
                      else -> {
                          // A restored queue may have lost its DownloadManager record. Retry the item.
                          items.firstOrNull { it.key == activeKey }?.status = "queued"
                          activeDownload = -1L; activeKey = ""
                          prefs.edit().remove("dl_active_id").remove("dl_active_key").apply()
                          saveQueue(); h.postDelayed({ startNext() },500)
                      }
                  }
              }
          
              private fun queryMime(id: Long): String {
                  return try {
                      dm.query(DownloadManager.Query().setFilterById(id))?.use { c ->
                          if (c.moveToFirst()) c.getString(c.getColumnIndexOrThrow(DownloadManager.COLUMN_MEDIA_TYPE)) ?: "" else ""
                      } ?: ""
                  } catch (_: Exception) { "" }
              }
          
              private fun addKnownExtension(name: String, mime: String, urlName: String): String {
                  if (name.contains(Regex("\\.[A-Za-z0-9]{2,8}$"))) return name
                  if (urlName.contains(Regex("\\.[A-Za-z0-9]{2,8}$"))) return urlName
                  val ext = when (mime.substringBefore(';').lowercase()) {
                      "video/mp4" -> ".mp4"
                      "video/webm" -> ".webm"
                      "video/quicktime" -> ".mov"
                      "video/x-matroska" -> ".mkv"
                      "video/x-msvideo" -> ".avi"
                      "application/zip", "application/x-zip-compressed" -> ".zip"
                      "application/x-rar-compressed", "application/vnd.rar" -> ".rar"
                      "application/x-7z-compressed" -> ".7z"
                      "application/x-tar" -> ".tar"
                      else -> ""
                  }
                  return if (ext.isNotEmpty()) name + ext else name
              }
          
              private fun safeName(s: String): String {
                  val clean = s.substringAfterLast('/').substringAfterLast('\\').replace(Regex("[^A-Za-z0-9._ ()-]"),"_").take(150)
                  return if (clean.isBlank()) "download_${System.currentTimeMillis()}.bin" else clean
              }
          
              private fun formatBytes(bytes: Long): String {
                  if (bytes < 0) return "Unknown size"
                  val mb = bytes / (1024.0 * 1024.0)
                  return if (mb >= 1024) String.format(java.util.Locale.US, "%.2f GB", mb / 1024.0)
                  else String.format(java.util.Locale.US, "%.1f MB", mb)
              }
          
              private fun updateStatus(extra: String? = null) {
                  val done = items.count { it.status == "handed_off" }
                  val pending = items.count { it.status == "queued" }
                  status.text = (extra?.plus("\n") ?: "") + "Selected: ${items.size} • pending: $pending • handed to uploader: $done\nDownload network: MOBILE DATA ONLY (Wi-Fi blocked)\nFree space: ${freeBytes()/1024/1024} MB"
              }
          
              override fun onBackPressed() {
                  if (running || activeDownload > 0) {
                      updateStatus("Download tab kept alive in the background")
                      moveTaskToBack(true)
                  } else super.onBackPressed()
              }
          
              override fun onDestroy() {
                  // Keep the active DownloadManager request and persisted queue alive if this tab is left.
                  h.removeCallbacksAndMessages(null)
                  try { web.destroy() } catch (_: Exception) { }
                  super.onDestroy()
              }
          }
