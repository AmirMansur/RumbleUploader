          document.addEventListener('click',function(e){if(!window.__rbuSelectMode)return;var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();try{RbuDownloadBridge.add(a.href,(a.innerText||a.getAttribute('download')||a.href.split('/').pop()||'download').trim(),a.type||'');}catch(x){}},true);
