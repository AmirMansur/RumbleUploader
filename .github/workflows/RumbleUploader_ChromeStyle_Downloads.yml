                  val cleanName = fileName.ifBlank { Uri.parse(url).lastPathSegment ?: "download" }.take(180)
                  val cookie = CookieManager.getInstance().getCookie(url) ?: ""
                  val agent = userAgent.ifBlank { web.settings.userAgentString }
                  val referer = web.url ?: ""
                  items.add(Item(key, url, cleanName, mimeType, "queued", cookie, agent, referer))
                  saveQueue()
                  updateStatus("Download started: $cleanName")
                  if (!running) startQueue()
              }
          
