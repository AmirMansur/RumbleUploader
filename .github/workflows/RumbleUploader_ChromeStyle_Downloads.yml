              /** A normal website download click starts immediately, like Chrome. */
              private fun addBrowserDownload(url: String, fileName: String, mimeType: String, userAgent: String) {
                  if (!url.startsWith("http://", true) && !url.startsWith("https://", true)) {
                      updateStatus("This download link type is not supported")
                      return
                  }
                  val key = sha(url)
                  val existing = items.firstOrNull { it.key == key }
                  if (existing != null) {
                      if (existing.status == "failed") existing.status = "queued"
                      saveQueue()
                      updateStatus("Already in downloads: ${existing.name}")
                      if (!running && existing.status == "queued") startQueue()
                      return
                  }
                  if (isPreviouslyCompleted(key)) {
                      updateStatus("This item is already marked completed")
                      return
