          package com.rbu.uploader

          import android.content.Context
          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock

          // Brings the uploader back if it was killed while a run was wanted.
          object Revive {
              @Volatile private var lastTry = 0L

              fun alive(): Boolean {
                  return MainActivity.instance != null && MainActivity.isRunning &&
                      SystemClock.elapsedRealtime() - MainActivity.lastBeat < 40000
              }

              fun ensure(ctx: Context) {
                  val p = ctx.getSharedPreferences("rbu", Context.MODE_PRIVATE)
                  if (!p.getBoolean("run_wanted", false)) return
                  // The app screen exists (it is starting up or running) - nothing to bring back.
                  if (MainActivity.instance != null) return
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastTry < 30000) return
                  lastTry = now
                  val n = p.getInt("revive_n", 0)
                  if (n >= 5) {
                      Notifier.postResume(ctx, "It could not restart by itself. Tap to continue.")
                      return
                  }
                  p.edit().putInt("revive_n", n + 1).apply()
                  try {
                      val i = Intent(ctx, MainActivity::class.java)
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                      i.putExtra("auto", true)
                      ctx.startActivity(i)
                  } catch (e: Exception) { }
                  // If Android refused to start it from the background, leave a tap-to-continue notification.
                  Handler(Looper.getMainLooper()).postDelayed({
                      if (p.getBoolean("run_wanted", false) && MainActivity.instance == null) {
                          Notifier.postResume(ctx, "The uploader was closed. Tap to continue.")
                      }
                  }, 8000)
              }
          }
