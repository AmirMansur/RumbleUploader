              var l=e.closest('label');
              var t=((l?l.innerText:'')+' '+(e.parentElement?e.parentElement.innerText:'')).toLowerCase();
              if(/rights|terms|agree|i own|copyright/.test(t)&&!/monetiz|comment|subscri|notif|adult|mature|nsfw|embed|download|discover/.test(t)){
                if(!e.checked){e.click();}
                if(e.checked)n++;
              }
            }
            return n;
          };
          R.unlisted=function(){
            var r=document.querySelectorAll('input[type=radio]');
            for(var i=0;i<r.length;i++){
              var e=r[i];
              var l=e.closest('label');
              var lf=e.id?document.querySelector('label[for="'+e.id+'"]'):null;
              var lt=((l?l.innerText:'')+' '+(lf?lf.innerText:'')+' '+(e.getAttribute('aria-label')||'')).trim();
              if(/unlisted/i.test(e.value||'')||/^\s*unlisted/i.test(lt)){
                if(!e.checked){e.click();}
                return e.checked?'ok':'unverified';
              }
            }
            var s=document.querySelectorAll('select');
            for(var a=0;a<s.length;a++){
              var o=s[a].options;
              for(var b=0;b<o.length;b++){
                if(/unlisted/i.test(o[b].text)){
                  if(s[a].selectedIndex!==b){s[a].selectedIndex=b;s[a].dispatchEvent(new Event('change',{bubbles:true}));}
                  return s[a].selectedIndex===b?'ok':'unverified';
                }
              }
            }
            var els=document.querySelectorAll('label,button,li,div,span,a,[role=radio],[role=option]');
            var best=null;
            for(var k=0;k<els.length;k++){
              var x=els[k];
              if(!R.vis(x)||R.inNav(x))continue;
              var tx=R.txt(x).toLowerCase();
              if(tx.indexOf('unlisted')===0&&tx.length<60){
                if(!best||R.txt(x).length<R.txt(best).length)best=x;
              }
            }
            if(best){
              var cl=best.classList;
              var sel=best.getAttribute('aria-checked')==='true'||best.getAttribute('aria-selected')==='true'||cl.contains('active')||cl.contains('selected')||cl.contains('checked');
              if(sel)return 'ok';
              best.click();
              return 'unverified';
            }
            return 'none';
          };
          R.submitBtn=function(){
            var names=['upload','publish','submit','save','post','done','finish','upload video','publish video','save changes'];
            var c=document.querySelectorAll('button,input[type=submit],input[type=button],[role=button]');
            var found=null;
            for(var i=0;i<c.length;i++){
              var e=c[i];
              if(!R.vis(e)||R.inNav(e))continue;
              var t=R.txt(e).toLowerCase();
              if(names.indexOf(t)>=0)found=e;
            }
            return found;
          };
          R.tickForm=function(t){
            var o={title:false};
            var e=R.titleEl();
            if(e){ if(e.value!==t)R.setVal(e,t); o.title=(e.value===t); }
            o.unl=R.unlisted();
            o.cat=R.category();
            o.agree=R.agree();
            var up=false,pct='';
            var ps=document.querySelectorAll('progress');
            for(var i=0;i<ps.length;i++){ if(R.vis(ps[i])&&ps[i].max&&ps[i].value<ps[i].max){up=true;} }
            var txt=document.body.innerText||'';
            var m=txt.match(/\b\d{1,3}(?:\.\d+)?\s?%/g)||[];
            for(var j=0;j<m.length;j++){ if(parseFloat(m[j])<100){up=true;pct=m[j];} }
            o.up=up; o.pct=pct;
            var b=R.submitBtn();
            o.submit='none';
            if(b){ o.submit=(b.disabled||b.getAttribute('aria-disabled')==='true'||b.classList.contains('disabled'))?'disabled':'ready'; }
            var er=txt.match(/(upload failed|failed to upload|something went wrong|error occurred)/i);
            o.err=er?er[0]:'';
                        return JSON.stringify(o);
          };
          R.clickSubmit=function(){
            var b=R.submitBtn();
            if(b&&!b.disabled){b.click();return '1';}
            return '0';
          };
          R.stage2Clicked=false;
          R.confirm=function(){
            R.agree(); // tick any newly-shown rights/terms checkboxes on this second stage
            var clicked=false;
            if(!R.stage2Clicked){
              var b=R.submitBtn();
              if(b){
                var label=R.txt(b).toLowerCase();
                if(label!=='back' && !b.disabled && !b.classList.contains('disabled')){
                  b.click();
                  R.stage2Clicked=true;
                  clicked=true;
                }
              }
            }
            return JSON.stringify({
              gone:!R.titleEl(),
              ok:/successfully (uploaded|published)|has been (uploaded|published)|upload complete|is being processed|processing your video/i.test(document.body.innerText||''),
              clicked:clicked
            });
          };
          R.pickRect=function(){
            var re=/(select|choose|browse|pick).{0,20}(video|file)|drag.{0,20}drop|drop.{0,20}here|upload (a )?(video|file)/i;
            var els=document.querySelectorAll('button,label,a,div,span,[role=button]');
            var best=null;
            for(var i=0;i<els.length;i++){
              var e=els[i];
              if(!R.vis(e)||R.inNav(e))continue;
              var tx=R.txt(e);
              if(tx.length>0&&tx.length<70&&re.test(tx)){
                if(!best||tx.length<R.txt(best).length)best=e;
              }
            }
            var t=best;
            if(!t){
              var fi=document.querySelector('input[type=file]');
              if(fi){
                var lb=fi.id?document.querySelector('label[for="'+fi.id+'"]'):null;
                t=(lb&&R.vis(lb))?lb:(fi.closest('label')||(R.vis(fi)?fi:fi.parentElement));
              }
            }
            if(!t)return '0';
            t.scrollIntoView({block:'center'});
            var r=t.getBoundingClientRect();
            if(r.width<2||r.height<2)return '0';
            return JSON.stringify({x:r.left+r.width/2,y:r.top+r.height/2,iw:window.innerWidth,txt:R.txt(t).slice(0,30)});
          };
          R.dump=function(){
            var o={url:location.href,title:document.title};
            function list(sel,onlyVis,f){
              var a=[];
              var q=document.querySelectorAll(sel);
              for(var i=0;i<q.length&&a.length<45;i++){
                if(onlyVis&&!R.vis(q[i]))continue;
                a.push(f(q[i]));
              }
              return a;
            }
            o.fields=list('input,textarea,select',false,function(e){return [e.tagName,e.type,e.name,e.id,e.placeholder,(e.value+'').slice(0,20),R.vis(e)?'vis':'hid',e.checked?'chk':''].join('|');});
            o.buttons=list('button,[role=button],input[type=submit],label',true,function(e){return R.txt(e).slice(0,40);});
            o.text=(document.body.innerText||'').replace(/\s+/g,' ').slice(0,700);
            return JSON.stringify(o);
          };
          window.__rbu=R;
          })();
          var R=window.__rbu;
          """
              }

              enum class S { IDLE, LOADING, PICKING, UPLOADING, SUBMITTING, CONFIRMING }
              data class Vid(val id: String, val name: String, val uri: Uri)

              private lateinit var wv: WebView
              private lateinit var logView: TextView
              private lateinit var logScroll: ScrollView
              private lateinit var statusView: TextView
              private lateinit var prefs: SharedPreferences
              private val h = Handler(Looper.getMainLooper())
              private var queue: List<Vid> = emptyList()
              private val failed = HashSet<String>()
              private var running = false
              private var busy = false
              private var state = S.IDLE
              private var cur: Vid? = null
              private var since = 0L
              private var lastTap = 0L
              private var lastTitleSeen = 0L
              private var lastPctLog = 0L
              private var picks = 0
              private var stable = 0
              private var catLogged = false
              private var stage2Logged = false
              private var pageLoaded = false
              private var chooserServed = false
              private var pendingUri: Uri? = null
              private var urlAtSubmit: String? = null
              private var wake: PowerManager.WakeLock? = null

              private fun dp(n: Int) = (n * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  prefs = getSharedPreferences("rbu", Context.MODE_PRIVATE)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Color.parseColor("#111111"))

                  fun btn(t: String, f: () -> Unit): Button {
                      val b = Button(this)
                      b.text = t
                      b.textSize = 11f
                      b.isAllCaps = false
                      b.minHeight = 0
                      b.minimumHeight = dp(40)
                      b.setPadding(dp(2), 0, dp(2), 0)
                      b.setOnClickListener { f() }
                      return b
                  }
                  fun row(vararg bs: Button): LinearLayout {
                      val r = LinearLayout(this)
                      r.orientation = LinearLayout.HORIZONTAL
                      for (b in bs) r.addView(b, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                      return r
                  }
                  root.addView(row(
                      btn("Select folder") { pickFolder() },
                      btn("Start") { startRun() },
                      btn("Stop") { stopRun("Stopped.") }
                  ))
                  root.addView(row(
                      btn("Skip video") { skipCurrent() },
                      btn("Debug") { debugDump() },
                      btn("Reset progress") { resetProgress() }
                  ))

                  statusView = TextView(this)
                  statusView.setTextColor(Color.WHITE)
                  statusView.textSize = 12f
                  statusView.setPadding(dp(8), dp(4), dp(8), dp(4))
                  root.addView(statusView)

                  wv = WebView(this)
                  val s = wv.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.allowContentAccess = true
                  s.mediaPlaybackRequiresUserGesture = false
                  s.userAgentString = UA
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(wv, true)
                  wv.webViewClient = object : WebViewClient() {
                      override fun onPageStarted(view: WebView?, url: String?, favicon: android.graphics.Bitmap?) {
                          pageLoaded = false
                      }
                      override fun onPageFinished(view: WebView?, url: String?) {
                          pageLoaded = true
                      }
                  }
                  wv.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePathCallback: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          val u = pendingUri
                          if (u != null && filePathCallback != null) {
                              pendingUri = null
                              chooserServed = true
                              since = SystemClock.elapsedRealtime()
                              filePathCallback.onReceiveValue(arrayOf(u))
                              log("  file handed to Rumble")
                          } else {
                              filePathCallback?.onReceiveValue(null)
                          }
                          return true
                      }
                  }
                  root.addView(wv, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 3f))

                  logView = TextView(this)
                  logView.setTextColor(Color.parseColor("#9fe870"))
                  logView.textSize = 11f
                  logView.setPadding(dp(8), dp(4), dp(8), dp(4))
                  logView.setTextIsSelectable(true)
                  logScroll = ScrollView(this)
                  logScroll.addView(logView)
                  root.addView(logScroll, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 2f))

                  setContentView(root)
                  wv.loadUrl(UPLOAD_URL)
                  log("1) Log in to Rumble in the browser above.\n2) Tap 'Select folder' and pick your videos folder.\n3) Tap 'Start'.\nBy using this app you confirm you own the videos and agree to Rumble's terms.")

                  val saved = prefs.getString("tree", null)
                  if (saved != null) {
                      try { loadVideos(Uri.parse(saved)) } catch (e: Exception) { log("Please select the folder again.") }
                  }
                  updateStatus()
              }

              override fun onDestroy() {
                  h.removeCallbacksAndMessages(null)
                  releaseWake()
                  wv.destroy()
                  super.onDestroy()
              }

              // ---------- folder ----------
              private fun pickFolder() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT_TREE)
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                  startActivityForResult(i, REQ_TREE)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_TREE && resultCode == RESULT_OK) {
                      val u = data?.data ?: return
                      try {
                          contentResolver.takePersistableUriPermission(u, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      } catch (e: Exception) { }
                      prefs.edit().putString("tree", u.toString()).apply()
                      try { loadVideos(u) } catch (e: Exception) { log("Could not read folder: " + e.message) }
                      updateStatus()
                  }
              }

              private fun cleanTitle(raw: String): String {
                  var t = raw
                  // drop (...) and {...} segments, including nested ones
                  repeat(5) {
                      t = t.replace(Regex("\\([^()]*\\)"), " ")
                      t = t.replace(Regex("\\{[^{}]*\\}"), " ")
                  }
                  return t.replace(Regex("\\s{2,}"), " ").trim()
              }

              private fun natKey(s: String): List<String> =
                  Regex("\\d+|\\D+").findAll(s.lowercase()).map { it.value }.toList()

              private val natCmp = Comparator<Vid> { a, b ->
                  val x = natKey(a.name)
                  val y = natKey(b.name)
                  var res = 0
                  var i = 0
                  while (res == 0 && i < minOf(x.size, y.size)) {
                      val p = x[i]
                      val q = y[i]
                      res = if (p[0].isDigit() && q[0].isDigit()) p.toBigInteger().compareTo(q.toBigInteger()) else p.compareTo(q)
                      i++
                  }
                  if (res != 0) res else x.size - y.size
              }

              private fun loadVideos(tree: Uri) {
                  val treeId = DocumentsContract.getTreeDocumentId(tree)
                  val children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, treeId)
                  val list = ArrayList<Vid>()
                  val ext = Regex(".*\\.(mp4|mov|mkv|avi|webm|m4v|3gp|flv|wmv|mpg|mpeg)")
                  val cur = contentResolver.query(
                      children,
                      arrayOf(
                          DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                          DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                          DocumentsContract.Document.COLUMN_MIME_TYPE
                      ), null, null, null
                  )
                  cur?.use {
                      while (it.moveToNext()) {
                          val id = it.getString(0)
                          val name = it.getString(1) ?: continue
                          val mime = it.getString(2) ?: ""
                          if (mime.startsWith("video/") || name.lowercase().matches(ext)) {
                              list.add(Vid(id, name, DocumentsContract.buildDocumentUriUsingTree(tree, id)))
                          }
                      }
                  }
                  queue = list.sortedWith(natCmp)
                  failed.clear()
                  log("Folder loaded: ${queue.size} video(s).")
              }

              // ---------- progress ----------
              private fun doneSet(): Set<String> = prefs.getStringSet("done", emptySet()) ?: emptySet()
              private fun isDone(id: String) = doneSet().contains(id)
              private fun doneCount() = queue.count { isDone(it.id) }

              private fun markDone(note: String) {
                  val n = HashSet<String>(doneSet())
                  cur?.let { n.add(it.id) }
                  prefs.edit().putStringSet("done", n).apply()
                  log("  ✔ done$note")
                  state = S.IDLE
                  updateStatus()
              }

              private fun resetProgress() {
                  prefs.edit().remove("done").apply()
                  failed.clear()
                  log("Progress reset: all videos will be uploaded again.")
                  updateStatus()
              }

              private fun updateStatus() {
                  statusView.text = "Videos: ${queue.size}  •  done: ${doneCount()}  •  " + (if (running) "RUNNING" else "stopped")
              }

              private fun log(m: String) {
                  logView.append(m + "\n")
                                    if (logView.length() > 30000) logView.text = logView.text.toString().takeLast(20000)
                  logScroll.post { logScroll.fullScroll(android.view.View.FOCUS_DOWN) }
              }

              // ---------- run control ----------
              private fun startRun() {
                  if (running) return
                  if (queue.isEmpty()) { log("Select a folder with videos first."); return }
                  running = true
                  busy = false
                  state = S.IDLE
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "rbu:run")
                      wake?.acquire(12 * 60 * 60 * 1000L)
                  } catch (e: Exception) { }
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), REQ_NOTIF)
                  }
                  try {
                      val svc = Intent(this, RbuService::class.java)
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(svc) else startService(svc)
                  } catch (e: Exception) { }
                  updateStatus()
                  h.post(ticker)
              }

              private fun stopRun(msg: String) {
                  running = false
                  busy = false
                  releaseWake()
                  try { stopService(Intent(this, RbuService::class.java)) } catch (e: Exception) { }
                  log(msg)
                  updateStatus()
              }

              private fun releaseWake() {
                  try { if (wake?.isHeld == true) wake?.release() } catch (e: Exception) { }
              }

              private fun skipCurrent() {
                  cur?.let { failed.add(it.id) }
                  pendingUri = null
                  busy = false
                  state = S.IDLE
                  log("Skipped current video.")
              }

              private fun fail(msg: String) {
                  log("  ✖ $msg — skipped")
                  cur?.let { failed.add(it.id) }
                  state = S.IDLE
                  updateStatus()
              }

              private val ticker = object : Runnable {
                  override fun run() {
                      if (!running) return
                      try { tick() } catch (e: Exception) { busy = false; log("Error: " + e) }
                      h.postDelayed(this, 1500)
                  }
              }

              // ---------- JS bridge ----------
              private fun unwrap(r: String?): String? {
                  if (r == null || r == "null") return null
                  return try { (JSONTokener(r).nextValue() as? String) ?: r } catch (e: Exception) { r }
              }

              private fun runJs(code: String, cb: (String?) -> Unit) {
                  wv.evaluateJavascript(HELPER + "\n" + code) { r -> cb(unwrap(r)) }
              }

              private fun tap(x: Float, y: Float) {
                  val t = SystemClock.uptimeMillis()
                  val d = MotionEvent.obtain(t, t, MotionEvent.ACTION_DOWN, x, y, 0)
                  wv.dispatchTouchEvent(d)
                  d.recycle()
                  h.postDelayed({
                      val t2 = SystemClock.uptimeMillis()
                      val u = MotionEvent.obtain(t, t2, MotionEvent.ACTION_UP, x, y, 0)
                      wv.dispatchTouchEvent(u)
                      u.recycle()
                  }, 90)
              }

              private fun debugDump() {
                  runJs("R.dump()") { r ->
                      val txt = try { JSONObject(r ?: "{}").toString(2) } catch (e: Exception) { r ?: "(no data)" }
                      log("--- DEBUG ---\n$txt\n--- copied to clipboard ---")
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("rumble-debug", txt))
                  }
              }

              // ---------- main state machine ----------
              private fun tick() {
                  if (busy) return
                  val now = SystemClock.elapsedRealtime()
                  val v = cur
                  when (state) {
                      S.IDLE -> {
                          val next = queue.firstOrNull { !isDone(it.id) && !failed.contains(it.id) }
                          if (next == null) {
                              stopRun("Finished. Done: ${doneCount()}/${queue.size}, skipped: ${failed.size}")
                              return
                          }
                          cur = next
                          log("▶ ${next.name}")
                          pageLoaded = false
                          chooserServed = false
                          pendingUri = null
                          picks = 0
                          stable = 0
                          lastTap = 0
                          catLogged = false
                          stage2Logged = false
                          wv.loadUrl(UPLOAD_URL)
                          state = S.LOADING
                          since = now
                      }
                      S.LOADING -> {
                          if (pageLoaded) {
                              val u = wv.url ?: ""
                              if (u.contains("login", true) || u.contains("signin", true)) {
                                  stopRun("Please log in to Rumble in the browser above, then press Start again.")
                                  return
                              }
                              pendingUri = v!!.uri
                              state = S.PICKING
                              since = now
                          } else if (now - since > 60000) {
                              fail("Page did not load")
                          }
                      }
                      S.PICKING -> {
                          busy = true
                          runJs("R.hasTitle()") { r ->
                              busy = false
                              val t = SystemClock.elapsedRealtime()
                              if (chooserServed) {
                                  if (r == "1") {
                                      state = S.UPLOADING
                                      since = t
                                      lastTitleSeen = t
                                      stable = 0
                                      log("  uploading…")
                                  } else if (t - since > 120000) {
                                      fail("Rumble did not show the details form")
                                  }
                              } else if (t - lastTap > 4000) {
                                  lastTap = t
                                  picks++
                                  if (picks > 10) {
                                      stopRun("Could not find the 'select video' button. Tap Debug and send me the text.")
                                  } else {
                                      busy = true
                                      runJs("R.pickRect()") { r2 ->
                                          busy = false
                                          if (r2 != null && r2 != "0") {
                                              val o = JSONObject(r2)
                                              val sc = wv.width.toFloat() / o.getDouble("iw").toFloat()
                                              tap(o.getDouble("x").toFloat() * sc, o.getDouble("y").toFloat() * sc)
                                              log("  tapped: " + o.optString("txt"))
                                          }
                                      }
                                  }
                              }
                          }
                      }
                      S.UPLOADING -> {
                          busy = true
                          val title = cleanTitle(v!!.name.substringBeforeLast('.'))
                          runJs("R.tickForm(" + JSONObject.quote(title) + ")") { r ->
                              busy = false
                              val t = SystemClock.elapsedRealtime()
                              val o = try { JSONObject(r ?: "{}") } catch (e: Exception) { JSONObject() }
                              if (!o.optBoolean("title")) {
                                  stable = 0
                                  if (t - lastTitleSeen > 120000) fail("Details form disappeared")
                              } else {
                                  lastTitleSeen = t
                                  val unl = o.optString("unl")
                                  val cat = o.optString("cat")
                                  val err = o.optString("err")
                                  val up = o.optBoolean("up")
                                  val ready = o.optString("submit") == "ready"
                                  if (err.isNotEmpty()) {
                                      fail("Rumble says: $err")
                                  } else {
                                      if (up && t - lastPctLog > 20000) {
                                          lastPctLog = t
                                          log("  uploading " + o.optString("pct"))
                                      }
                                      if (cat == "ok" && !catLogged) { catLogged = true; log("  category: Entertainment") }
                                      if (!up && ready) stable++ else stable = 0
                                      if (stable >= 4 && t - since > 15000) {
                                          if (unl != "ok") {
                                              stopRun("Ready to submit, but I could not confirm 'Unlisted' is selected, so I did NOT submit. Tap Debug and send me the text.")
                                          } else if (cat != "ok") {
                                              stopRun("Ready to submit, but I could not confirm the 'Entertainment' category is selected, so I did NOT submit. Tap Debug and send me the text.")
                                          } else {
                                              state = S.SUBMITTING
                                          }
                                      } else if (t - since > 6 * 3600 * 1000L) {
                                          fail("Upload took too long")
                                      }
                                  }
                              }
                          }
                      }
                      S.SUBMITTING -> {
                          busy = true
                          runJs("R.clickSubmit()") { r ->
                              busy = false
                              if (r == "1") {
                                  urlAtSubmit = wv.url
                                  state = S.CONFIRMING
                                  since = SystemClock.elapsedRealtime()
                                  log("  submitted")
                              } else {
                                  stable = 0
                                  state = S.UPLOADING
                              }
                          }
                      }
                      S.CONFIRMING -> {
                          busy = true
                          runJs("R.confirm()") { r ->
                              busy = false
                              val t = SystemClock.elapsedRealtime()
                              val o = try { JSONObject(r ?: "{}") } catch (e: Exception) { JSONObject() }
                              val changed = (wv.url ?: "") != (urlAtSubmit ?: "")
                              if (o.optBoolean("clicked") && !stage2Logged) {
                                  stage2Logged = true
                                  log("  confirmed rights/terms and submitted final step")
                              }
                              if (o.optBoolean("gone") || o.optBoolean("ok") || changed) {
                                  markDone("")
                              } else if (t - since > 90000) {
                                  markDone(" (could not confirm - please check Rumble)")
                              }
                          }
                      }
                  }
              }
          }
          RBU_EOF
          cat > app/src/main/java/com/rbu/uploader/RbuService.kt <<'RBU_EOF'
          package com.rbu.uploader

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager

          class RbuService : Service() {
              private var wake: PowerManager.WakeLock? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val chId = "rbu_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = getSystemService(NotificationManager::class.java)
                      val ch = NotificationChannel(chId, "Rumble Uploader", NotificationManager.IMPORTANCE_LOW)
                      nm.createNotificationChannel(ch)
                  }
                  val notif: Notification =
                      (if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) Notification.Builder(this, chId) else Notification.Builder(this))
                          .setContentTitle("Rumble Uploader")
                          .setContentText("Uploading videos in the background…")
                          .setSmallIcon(android.R.drawable.stat_sys_upload)
                          .setOngoing(true)
                          .build()
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          startForeground(1, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                      } else {
                          startForeground(1, notif)
                      }
                  } catch (e: Exception) { }
                  try {
                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "rbu:service")
                      wake?.acquire(12 * 60 * 60 * 1000L)
                  } catch (e: Exception) { }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY

              override fun onDestroy() {
                  try { if (wake?.isHeld == true) wake?.release() } catch (e: Exception) { }
                  super.onDestroy()
              }
          }
          RBU_EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RumbleUploader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: app/build/outputs/apk/debug/app-debug.apk

