          class MainActivity : Activity() {

              companion object {
                  const val UPLOAD_URL = "https://rumble.com/upload.php"
                  const val REQ_TREE = 11
                  const val UA = "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"
                  const val HELPER = """(function(){
          if(window.__rbu)return;
          var R={};
          R.vis=function(e){return !!e&&(e.offsetWidth>0||e.offsetHeight>0||e.getClientRects().length>0);};
          R.txt=function(e){return ((e.innerText||e.value||e.textContent||'')+'').replace(/\s+/g,' ').trim();};
          R.inNav=function(e){return !!e.closest('header,nav,[role=navigation],footer');};
