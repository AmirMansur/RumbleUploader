              var now=target.getAttribute('aria-checked')==='true'||target.getAttribute('aria-selected')==='true'||target.classList.contains('selected')||target.classList.contains('active')||target.classList.contains('checked');
              if(cb&&cb.checked)now=true;
              if(now||already2){ R.categoryDone=true; return 'ok'; }
              return 'clicked';
            }
            if(R.categoryDone) return 'ok';
            // 4) need to open a category picker/dropdown first
            var trig=document.querySelectorAll('label,button,div,span,a,[role=button],input');
            var openEl=null;
            for(var c=0;c<trig.length;c++){
