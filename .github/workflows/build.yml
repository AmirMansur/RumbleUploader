                }
              }
              return false;
            }

            if(!R.categoryOpened){
              R.categoryOpened=true;
              box.focus();
              box.dispatchEvent(new MouseEvent('mousedown',{bubbles:true}));
              box.dispatchEvent(new MouseEvent('mouseup',{bubbles:true}));
              box.click();
              return 'opening';
            }
            if(findAndClick()) return 'clicked';

            // nothing near the box yet - drive real key events so Rumble's own filter fires
            R.categoryTries++;
            if(R.categoryTries===2){
              try{
                box.focus();
                box.value='';
                box.dispatchEvent(new Event('input',{bubbles:true}));
                var s='Entertainment';
                for(var k=0;k<s.length;k++){
                  box.value=s.slice(0,k+1);
                  box.dispatchEvent(new KeyboardEvent('keydown',{bubbles:true,key:s[k]}));
                  box.dispatchEvent(new Event('input',{bubbles:true}));
                  box.dispatchEvent(new KeyboardEvent('keyup',{bubbles:true,key:s[k]}));
                }
                box.dispatchEvent(new Event('change',{bubbles:true}));
