            for(var i=0;i<q.length;i++){ if(R.vis(q[i])&&!R.inNav(q[i]))return q[i]; }
            return null;
          };
          R.hasTitle=function(){return R.titleEl()?'1':'0';};
          R.categoryDone=false;
          R.category=function(){
            var WANT=/entertainment/i;
            // 1) native <select> for category
            var s=document.querySelectorAll('select');
            for(var i=0;i<s.length;i++){
              var e=s[i];
              var k=(e.name+' '+e.id+' '+(e.getAttribute('aria-label')||'')).toLowerCase();
              if(k.indexOf('categ')>=0){
                var opts=e.options;
                if(!WANT.test((opts[e.selectedIndex]||{}).text||'')){
                  var pick=-1;
                  for(var j=0;j<opts.length;j++){ if(WANT.test(opts[j].text)){pick=j;break;} }
                  if(pick<0){ for(var j2=0;j2<opts.length;j2++){ if(opts[j2].value){pick=j2;break;} } }
                  if(pick>=0){ e.selectedIndex=pick; e.dispatchEvent(new Event('change',{bubbles:true})); }
