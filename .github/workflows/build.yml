                  logScroll = ScrollView(this)
                  logScroll.addView(logView)
                  root.addView(logScroll, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1.2f))

                  val mp = ViewGroup.LayoutParams.MATCH_PARENT
                  val wc = ViewGroup.LayoutParams.WRAP_CONTENT
                  val frame = FrameLayout(this)
                  frame.addView(root, FrameLayout.LayoutParams(mp, mp))
                  lockLayer = FrameLayout(this)
                  lockLayer.visibility = View.GONE
                  lockLayer.isClickable = true
                  lockLabel = TextView(this)
                  lockLabel.setTextColor(Color.WHITE)
                  lockLabel.textSize = 18f
                  lockLayer.addView(lockLabel, FrameLayout.LayoutParams(wc, wc, Gravity.CENTER))
                  unlockBtn = Button(this)
                  unlockBtn.text = "Unlock"
                  unlockBtn.isAllCaps = false
                  unlockBtn.setOnClickListener { unlockScreen() }
                  lockLayer.addView(unlockBtn, FrameLayout.LayoutParams(wc, wc, Gravity.TOP or Gravity.END))
                  frame.addView(lockLayer, FrameLayout.LayoutParams(mp, mp))
                  setContentView(frame)
                  wv.loadUrl(UPLOAD_URL)
                  log("1) Log in to Rumble in the browser above.\n2) Tap 'Select folder' and pick your videos folder.\n3) Tap 'Start'.\nBy using this app you confirm you own the videos and agree to Rumble's terms.")

                  val saved = prefs.getString("tree", null)
                  if (saved != null) {
                      try { loadVideos(Uri.parse(saved)) } catch (e: Exception) { log("Please select the folder again.") }
                  }
                  updateStatus()
              }

              override fun onDestroy() {
                  h.removeCallbacksAndMessages(null)
                  releaseWake()
                  if (floating) { try { dock(false) } catch (e: Exception) { } }
                  wv.destroy()
                  super.onDestroy()
              }

              // ---------- lock / dim ----------
              private fun resetBrightness() {
                  val a = window.attributes
                  a.screenBrightness = WindowManager.LayoutParams.BRIGHTNESS_OVERRIDE_NONE
                  window.attributes = a
              }

              private fun lockScreen(dim: Boolean) {
                  locked = true
                  if (dim) {
                      lockLayer.setBackgroundColor(Color.BLACK)
                      lockLabel.text = ""
                      unlockBtn.setTextColor(Color.parseColor("#777777"))
                      unlockBtn.setBackgroundColor(Color.parseColor("#151515"))
                      val a = window.attributes
                      a.screenBrightness = 0.01f
                      window.attributes = a
                  } else {
                      lockLayer.setBackgroundColor(Color.parseColor("#66000000"))
                      lockLabel.text = "🔒 Locked"
                      unlockBtn.setTextColor(Color.WHITE)
                      unlockBtn.setBackgroundColor(Color.parseColor("#CC333333"))
                      resetBrightness()
                  }
                  lockLayer.visibility = View.VISIBLE
              }

              private fun unlockScreen() {
                  locked = false
                                    lockLayer.visibility = View.GONE
                  resetBrightness()
              }

              override fun onBackPressed() {
                  if (locked) return
                  super.onBackPressed()
              }

              // ---------- floating window ----------
              private fun toggleFloat() {
                  if (floating) dock(false) else startFloat()
              }

              private fun makeShield(lp: WindowManager.LayoutParams, wm: WindowManager, box: View): View {
                  val shield = View(this)
                  var downX = 0f
                  var downY = 0f
                  var startX = 0
                  var startY = 0
                  var dragged = false
                  shield.setOnTouchListener { _, ev ->
                      when (ev.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = ev.rawX
                              downY = ev.rawY
                              startX = lp.x
                              startY = lp.y
                              dragged = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = ev.rawX - downX
                                                            val dy = ev.rawY - downY
                              if (!dragged && (Math.abs(dx) > dp(12) || Math.abs(dy) > dp(12))) dragged = true
                              if (dragged) {
                                  lp.x = startX + dx.toInt()
                                  lp.y = startY + dy.toInt()
                                  try { wm.updateViewLayout(box, lp) } catch (e: Exception) { }
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!dragged) floatTap()
                          }
                      }
                      true
                  }
                  return shield
              }

              private fun floatTap() {
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastFloatTap > 700) floatTaps = 0
                  lastFloatTap = now
                  floatTaps++
                  if (floatTaps >= 3) {
                      floatTaps = 0
                      h.post { dock(true) }
                  }
              }

              private fun startFloat() {
                  if (floating) return
                  if (!android.provider.Settings.canDrawOverlays(this)) {
                      log("Allow 'Display over other apps' for this app on the screen that just opened, then tap Float again.")
                      try {
                          startActivity(Intent(android.provider.Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      } catch (e: Exception) { }
                      return
                  }
                  val mp = ViewGroup.LayoutParams.MATCH_PARENT
                  val dm = resources.displayMetrics
                  val wm = applicationContext.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val idx = root.indexOfChild(wv)
                  root.removeView(wv)
                  val ph = TextView(this)
                  ph.text = "Browser is floating as a small bubble.\nTriple-tap the bubble, or press Dock, to bring it back."
                  ph.setTextColor(Color.WHITE)
                  ph.gravity = Gravity.CENTER
                  root.addView(ph, if (idx < 0) root.childCount else idx, LinearLayout.LayoutParams(mp, 0, 4f))
                  placeholder = ph

                  // Bubble is tiny (like a screen-recorder pill), but the real WebView inside it
                  // is kept at a normal working size and just visually scaled down to fit -
                  // Android still treats it as a fully live, attached, non-zero-size view.
                  val bubbleDp = 52
                  val bubblePx = dp(bubbleDp)
                  val innerDp = 360
                  val innerPx = dp(innerDp)
                  val scale = bubblePx.toFloat() / innerPx.toFloat()

                  val box = FrameLayout(this)
                  box.clipChildren = true
                  box.clipToOutline = true
                  box.background = android.graphics.drawable.GradientDrawable().apply {
                      shape = android.graphics.drawable.GradientDrawable.OVAL
                      setColor(Color.parseColor("#9FE870"))
                      setStroke(dp(2), Color.parseColor("#1b5e20"))
                  }
                  box.addView(wv, FrameLayout.LayoutParams(innerPx, innerPx))
                  wv.pivotX = 0f
                  wv.pivotY = 0f
                  wv.scaleX = scale
                  wv.scaleY = scale

                  val type = if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE
                  val lp = WindowManager.LayoutParams(
                      bubblePx, bubblePx,
                      type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON or WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = dm.widthPixels - bubblePx - dp(12)
                  lp.y = dp(140)
                  box.addView(makeShield(lp, wm, box), FrameLayout.LayoutParams(mp, mp))
                  wm.addView(box, lp)
                  floatBox = box
                  floating = true
                  floatBtn?.text = "Dock"
                  log("Floating as a small bubble. Triple-tap it to open the app, or drag it to move it.")
                  h.postDelayed({ moveTaskToBack(true) }, 400)
              }

              private fun dock(openApp: Boolean) {
                  if (!floating) return
                  if (openApp) {
                      try {
                          val i = Intent(this, MainActivity::class.java)
                          i.addFlags(Intent.FLAG_ACTIVITY_REORDER_TO_FRONT or Intent.FLAG_ACTIVITY_NEW_TASK)
                          startActivity(i)
                      } catch (e: Exception) { }
                  }
                  val box = floatBox
                  val wm = applicationContext.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  try { if (box != null) wm.removeView(box) } catch (e: Exception) { }
                  try { box?.removeView(wv) } catch (e: Exception) { }
                  wv.scaleX = 1f
                  wv.scaleY = 1f
                  wv.pivotX = (wv.width / 2).toFloat()
                  wv.pivotY = (wv.height / 2).toFloat()
                  var idx = root.childCount
                  val ph = placeholder
                  if (ph != null) {
                      idx = root.indexOfChild(ph)
                      root.removeView(ph)
                  }
                  if (idx < 0) idx = root.childCount
                  if (wv.parent == null) root.addView(wv, idx, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 4f))
                  floatBox = null
                  placeholder = null
                  floating = false
                  floatBtn?.text = "Float"
              }

              // ---------- folder ----------
              private fun pickFolder() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT_TREE)
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                  startActivityForResult(i, REQ_TREE)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_TREE && resultCode == RESULT_OK) {
                      val u = data?.data ?: return
                      try {
                          contentResolver.takePersistableUriPermission(u, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      } catch (e: Exception) { }
                      prefs.edit().putString("tree", u.toString()).apply()
                      try { loadVideos(u) } catch (e: Exception) { log("Could not read folder: " + e.message) }
                      updateStatus()
                  }
              }

              private fun cleanTitle(raw: String): String {
                  var t = raw
                  // drop (...), {...} and [...] segments, including nested ones
                  repeat(5) {
                      t = t.replace(Regex("\\([^()]*\\)"), " ")
                      t = t.replace(Regex("\\{[^{}]*\\}"), " ")
                      t = t.replace(Regex("\\[[^\\[\\]]*\\]"), " ")
                  }
                  return t.replace(Regex("\\s{2,}"), " ").trim()
              }

              private fun natKey(s: String): List<String> =
                  Regex("\\d+|\\D+").findAll(s.lowercase()).map { it.value }.toList()

              private val natCmp = Comparator<Vid> { a, b ->
                  val x = natKey(a.name)
                  val y = natKey(b.name)
                  var res = 0
                  var i = 0
                  while (res == 0 && i < minOf(x.size, y.size)) {
                      val p = x[i]
                      val q = y[i]
                      res = if (p[0].isDigit() && q[0].isDigit()) p.toBigInteger().compareTo(q.toBigInteger()) else p.compareTo(q)
                      i++
                  }
                  if (res != 0) res else x.size - y.size
              }

              private fun loadVideos(tree: Uri) {
                  val treeId = DocumentsContract.getTreeDocumentId(tree)
                  val children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, treeId)
                  val list = ArrayList<Vid>()
                  val ext = Regex(".*\\.(mp4|mov|mkv|avi|webm|m4v|3gp|flv|wmv|mpg|mpeg)")
                  val cur = contentResolver.query(
                      children,
                      arrayOf(
                          DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                          DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                          DocumentsContract.Document.COLUMN_MIME_TYPE
                      ), null, null, null
                  )
                  cur?.use {
                      while (it.moveToNext()) {
                          val id = it.getString(0)
                          val name = it.getString(1) ?: continue
                          val mime = it.getString(2) ?: ""
                          if (mime.startsWith("video/") || name.lowercase().matches(ext)) {
                              list.add(Vid(id, name, DocumentsContract.buildDocumentUriUsingTree(tree, id)))
                          }
                      }
                  }
                  queue = list.sortedWith(natCmp)
                  failed.clear()
                  log("Folder loaded: ${queue.size} video(s).")
              }

              // ---------- progress ----------
              private fun doneSet(): Set<String> = prefs.getStringSet("done", emptySet()) ?: emptySet()
              private fun isDone(id: String) = doneSet().contains(id)
              private fun doneCount() = queue.count { isDone(it.id) }

              private fun markDone(note: String) {
                  val n = HashSet<String>(doneSet())
                  cur?.let { n.add(it.id) }
                  prefs.edit().putStringSet("done", n).apply()
                  log("  ✔ done$note")
                  state = S.IDLE
                  updateStatus()
              }

              private fun resetProgress() {
                  prefs.edit().remove("done").apply()
                  failed.clear()
                  log("Progress reset: all videos will be uploaded again.")
                  updateStatus()
              }

              private fun updateStatus() {
                  statusView.text = "Videos: ${queue.size}  •  done: ${doneCount()}  •  " + (if (running) "RUNNING" else "stopped")
              }

              private fun log(m: String) {
                  logView.append(m + "\n")
                  if (logView.length() > 30000) logView.text = logView.text.toString().takeLast(20000)
                  logScroll.post { logScroll.fullScroll(android.view.View.FOCUS_DOWN) }
              }

              // ---------- run control ----------
              private fun startRun() {
                  if (running) return
                  if (queue.isEmpty()) { log("Select a folder with videos first."); return }
                  running = true
                  busy = false
                  state = S.IDLE
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "rbu:run")
                      wake?.acquire(12 * 60 * 60 * 1000L)
                  } catch (e: Exception) { }
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), REQ_NOTIF)
                  }
                  try {
                      val pmc = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (!pmc.isIgnoringBatteryOptimizations(packageName)) {
                          val i = Intent(android.provider.Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)
                          i.data = Uri.parse("package:$packageName")
                          startActivity(i)
                          log("Allow 'unrestricted battery use' on the screen that just opened, then tap Start again.")
                          running = false
                          releaseWake()
                          return
                      }
                  } catch (e: Exception) { }
                  try {
                      val svc = Intent(this, RbuService::class.java)
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(svc) else startService(svc)
                  } catch (e: Exception) { }
                  updateStatus()
                  h.post(ticker)
              }

              private fun stopRun(msg: String) {
                  running = false
                  busy = false
                  releaseWake()
                  try { stopService(Intent(this, RbuService::class.java)) } catch (e: Exception) { }
                  log(msg)
                  updateStatus()
              }

              private fun releaseWake() {
                  try { if (wake?.isHeld == true) wake?.release() } catch (e: Exception) { }
              }

              private fun skipCurrent() {
                  cur?.let { failed.add(it.id) }
                  pendingUri = null
                  busy = false
                  state = S.IDLE
                  log("Skipped current video.")
              }

              private fun fail(msg: String) {
                  log("  ✖ $msg — skipped")
                  cur?.let { failed.add(it.id) }
                  state = S.IDLE
                  updateStatus()
              }

              private val ticker = object : Runnable {
                  override fun run() {
                      if (!running) return
                      try { tick() } catch (e: Exception) { busy = false; log("Error: " + e) }
                      h.postDelayed(this, 1500)
                  }
              }

              // ---------- JS bridge ----------
              private fun unwrap(r: String?): String? {
                                if (r == null || r == "null") return null
                  return try { (JSONTokener(r).nextValue() as? String) ?: r } catch (e: Exception) { r }
              }

              private fun runJs(code: String, cb: (String?) -> Unit) {
                  wv.evaluateJavascript(HELPER + "\n" + code) { r -> cb(unwrap(r)) }
              }

              private fun tap(x: Float, y: Float) {
                  val t = SystemClock.uptimeMillis()
                  val d = MotionEvent.obtain(t, t, MotionEvent.ACTION_DOWN, x, y, 0)
                  wv.dispatchTouchEvent(d)
                  d.recycle()
                  h.postDelayed({
                      val t2 = SystemClock.uptimeMillis()
                      val u = MotionEvent.obtain(t, t2, MotionEvent.ACTION_UP, x, y, 0)
                      wv.dispatchTouchEvent(u)
                      u.recycle()
                  }, 90)
              }

              private fun tapFrom(r: String?) {
                  if (r == null || !r.startsWith("{")) return
                  try {
                      val po = JSONObject(r)
                      val sc = wv.width.toFloat() / po.getDouble("iw").toFloat()
                      tap(po.getDouble("x").toFloat() * sc, po.getDouble("y").toFloat() * sc)
                  } catch (e: Exception) { }
              }

              // One-shot category selection: open box, tap option, then (if needed) synthetic click. No looping.
              private fun catSequence(round: Int) {
                  wv.requestFocus()
                  runJs("R.catScroll('box')") { _ ->
                      h.postDelayed({
                          runJs("R.catRect('box')") { r1 ->
                              tapFrom(r1)
                              h.postDelayed({
                                  runJs("R.catScroll('opt')") { _ ->
                                      h.postDelayed({
                                          runJs("R.catRect('opt')") { r2 ->
                                              tapFrom(r2)
                                              h.postDelayed({
                                                  runJs("R.catSynth()") { _ ->
                                                      h.postDelayed({
                                                          busy = false
                                                          log("  category: Entertainment (selected once)")
                                                      }, 1200)
                                                  }
                                              }, 1500)
                                          }
                                      }, 600)
                                  }
                              }, 1000)
                          }
                      }, 600)
                  }
              }

              private fun debugDump() {
                  runJs("R.dump()") { r ->
                                        val txt = try { JSONObject(r ?: "{}").toString(2) } catch (e: Exception) { r ?: "(no data)" }
                      log("--- DEBUG ---\n$txt\n--- copied to clipboard ---")
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("rumble-debug", txt))
                  }
              }

              // ---------- main state machine ----------
              private fun tick() {
                  if (busy) return
                  val now = SystemClock.elapsedRealtime()
                  val v = cur
                  when (state) {
                      S.IDLE -> {
                          val next = queue.firstOrNull { !isDone(it.id) && !failed.contains(it.id) }
                          if (next == null) {
                              stopRun("Finished. Done: ${doneCount()}/${queue.size}, skipped: ${failed.size}")
                              return
                          }
                          cur = next
                          log("▶ ${next.name}")
                          pageLoaded = false
                          chooserServed = false
                          pendingUri = null
                          picks = 0
                          stable = 0
                          lastTap = 0
                          catLogged = false
                          stage2Logged = false
                          lastCatTap = 0
                          s1Taps = 0
                          catRounds = 0
                          catWaitLogged = false
                          s2Taps = 0
                          s2First = 0
                          lastS2Tap = 0
                          disLogged = false
                          wv.loadUrl(UPLOAD_URL)
                          state = S.LOADING
                          since = now
                      }
                      S.LOADING -> {
                          if (pageLoaded) {
                              val u = wv.url ?: ""
                              if (u.contains("login", true) || u.contains("signin", true)) {
                                  stopRun("Please log in to Rumble in the browser above, then press Start again.")
                                  return
                              }
                              pendingUri = v!!.uri
                              state = S.PICKING
                              since = now
                          } else if (now - since > 60000) {
                              fail("Page did not load")
                          }
                      }
                      S.PICKING -> {
                          busy = true
                          runJs("R.hasTitle()") { r ->
                              busy = false
                              val t = SystemClock.elapsedRealtime()
                              if (chooserServed) {
                                  if (r == "1") {
                                      state = S.UPLOADING
                                      since = t
                                      lastTitleSeen = t
                                      stable = 0
                                      log("  uploading…")
                                  } else if (t - since > 120000) {
                                      fail("Rumble did not show the details form")
                                  }
                              } else if (t - lastTap > 4000) {
                                  lastTap = t
                                  picks++
                                  if (picks > 10) {
                                      stopRun("Could not find the 'select video' button. Tap Debug and send me the text.")
                                  } else {
                                      busy = true
                                      runJs("R.pickRect()") { r2 ->
                                          busy = false
                                          if (r2 != null && r2 != "0") {
                                              val o = JSONObject(r2)
                                              val sc = wv.width.toFloat() / o.getDouble("iw").toFloat()
                                              tap(o.getDouble("x").toFloat() * sc, o.getDouble("y").toFloat() * sc)
                                              log("  tapped: " + o.optString("txt"))
                                          }
                                      }
                                  }
                              }
                          }
                      }
                      S.UPLOADING -> {
                          busy = true
                          val title = cleanTitle(v!!.name.substringBeforeLast('.'))
                          runJs("R.tickForm(" + JSONObject.quote(title) + ")") { r ->
                              val t = SystemClock.elapsedRealtime()
                              val o = try { JSONObject(r ?: "{}") } catch (e: Exception) { JSONObject() }
                              var needCatTap = false
                              if (!o.optBoolean("title")) {
                                  stable = 0
                                  if (t - lastTitleSeen > 120000) fail("Details form disappeared")
                              } else {
                                  lastTitleSeen = t
                                  val unl = o.optString("unl")
                                  val cat = o.optString("cat")
                                  val err = o.optString("err")
                                  val up = o.optBoolean("up")
                                  val ready = o.optString("submit") == "ready"
                                  if (err.isNotEmpty()) {
                                      fail("Rumble says: $err")
                                  } else {
                                      if (up && t - lastPctLog > 20000) {
                                          lastPctLog = t
                                          log("  uploading " + o.optString("pct"))
                                      }
                                      if (catRounds == 0) {
                                          needCatTap = true
                                      }
                                      if (!up && ready) stable++ else stable = 0
                                      if (stable >= 4 && t - since > 15000) {
                                          if (unl != "ok") {
                                              stopRun("Ready to submit, but I could not confirm 'Unlisted' is selected, so I did NOT submit. Tap Debug and send me the text.")
                                          } else if (catRounds == 0) {
                                              // category step has not run yet - let it run first
                                          } else {
                                              state = S.SUBMITTING
                                          }
                                      } else if (t - since > 6 * 3600 * 1000L) {
                                          fail("Upload took too long")
                                      }
                                  }
                              }
                              if (needCatTap && state == S.UPLOADING) {
                                  catRounds++
                                  catSequence(catRounds)
                              } else {
                                  busy = false
                              }
                          }
                      }
                      S.SUBMITTING -> {
                          busy = true
                          runJs("R.submitRect()") { r ->
                              busy = false
                              if (r != null && r != "0") {
                                  try {
                                      val o = JSONObject(r)
                                      val sc = wv.width.toFloat() / o.getDouble("iw").toFloat()
                                      tap(o.getDouble("x").toFloat() * sc, o.getDouble("y").toFloat() * sc)
                                      s1Taps++
                                      urlAtSubmit = wv.url
                                      state = S.CONFIRMING
                                      since = SystemClock.elapsedRealtime()
                                      log("  submitted (real tap " + s1Taps + ")")
                                  } catch (e: Exception) {
                                      stable = 0
                                      state = S.UPLOADING
                                  }
                              } else {
                                  stable = 0
                                  state = S.UPLOADING
                              }
                          }
                      }
                      S.CONFIRMING -> {
                          busy = true
                          runJs("R.s2()") { r ->
                              busy = false
                              val t = SystemClock.elapsedRealtime()
                              val o = try { JSONObject(r ?: "{}") } catch (e: Exception) { JSONObject() }
                              val curUrl = wv.url ?: ""
                              val left = !curUrl.contains("upload", true)
                              val changed = curUrl != (urlAtSubmit ?: "")
                              val s2vis = o.optBoolean("vis")
                              val titleVis = o.optBoolean("title")
                              if (s2vis && s2First == 0L) s2First = t
                              if (left || (s2Taps > 0 && (changed || o.optBoolean("ok")))) {
                                  markDone("")
                              } else if (s2Taps > 0 && !s2vis && !titleVis) {
                                  markDone("")
                              } else if (s2vis) {
                                  if (!stage2Logged) { stage2Logged = true; log("  final page: Personal Use + rights/terms") }
                                  if (o.optBoolean("disabled")) {
                                      if (!disLogged) { disLogged = true; log("  final Submit is greyed out, waiting...") }
                                  } else if (s2Taps >= 6) {
                                      fail("Final Submit did not respond to 6 taps. Tap Debug and send me the text")
                                  } else if (t - s2First > 3000 && t - lastS2Tap > 5000 && o.has("x")) {
                                      val sc = wv.width.toFloat() / o.getDouble("iw").toFloat()
                                      tap(o.getDouble("x").toFloat() * sc, o.getDouble("y").toFloat() * sc)
                                      s2Taps++
                                      lastS2Tap = t
                                      log("  tapped final Submit (" + s2Taps + ")")
                                  }
                              } else if (titleVis && t - since > 8000 && s1Taps < 4) {
                                  state = S.SUBMITTING
                              } else if (t - since > 120000) {
                                  markDone(" (could not confirm - please check Rumble)")
                              }
                          }
                      }
                  }
              }
          }
          RBU_EOF
          cat > app/src/main/java/com/rbu/uploader/RbuService.kt <<'RBU_EOF'
          package com.rbu.uploader

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager

          class RbuService : Service() {
              private var wake: PowerManager.WakeLock? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val chId = "rbu_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = getSystemService(NotificationManager::class.java)
                      val ch = NotificationChannel(chId, "Rumble Uploader", NotificationManager.IMPORTANCE_LOW)
                      nm.createNotificationChannel(ch)
                  }
                  val notif: Notification =
                      (if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) Notification.Builder(this, chId) else Notification.Builder(this))
                          .setContentTitle("Rumble Uploader")
                          .setContentText("Uploading videos in the background…")
                          .setSmallIcon(android.R.drawable.stat_sys_upload)
                          .setOngoing(true)
                          .build()
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          startForeground(1, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                      } else {
                          startForeground(1, notif)
                      }
                  } catch (e: Exception) { }
                  try {
                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "rbu:service")
                      wake?.acquire(12 * 60 * 60 * 1000L)
                  } catch (e: Exception) { }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY

              override fun onDestroy() {
                  try { if (wake?.isHeld == true) wake?.release() } catch (e: Exception) { }
                  super.onDestroy()
              }
          }
          RBU_EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RumbleUploader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: app/build/outputs/apk/debug/app-debug.apk


