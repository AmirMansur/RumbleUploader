          R.titleEl=function(){
            var q=document.querySelectorAll('input[name=title],input#title,textarea[name=title],input[placeholder*="itle" i],input[aria-label*="itle" i],textarea[placeholder*="itle" i]');
            for(var i=0;i<q.length;i++){ if(R.vis(q[i])&&!R.inNav(q[i]))return q[i]; }
            return null;
          };
          R.hasTitle=function(){return R.titleEl()?'1':'0';};
          R.categoryOpened=false;
          R.categoryTyped=false;
          R.categoryTries=0;
          R.category=function(){
            var WANT=/^entertainment$/i;
            // Rumble's real bound field - authoritative check
            var hp=document.querySelector('input[name=category_primary]');
            if(hp && hp.value && hp.value!=='0' && hp.value!=='') return 'ok';
            // the visible text box the user clicks to open the category list
            var box=document.querySelector('input[name="primary-category"]') ||
                     document.querySelector('input[placeholder*="rimary categor" i]');
            if(!box || !R.vis(box)) return 'none';
            var br=box.getBoundingClientRect();

            function nearBox(el){
              var r=el.getBoundingClientRect();
              if(r.width<1||r.height<1)return false;
              if(r.top < br.top - 5) return false;           // must be at/below the box, not above (rules out far-away page content)
              if(r.top - br.bottom > 400) return false;       // not absurdly far below (rules out footer/sidebar links)
              if(r.right < br.left - 40 || r.left > br.right + 400) return false; // roughly under/near the box, not across the page
              return true;
            }
            function findAndClick(){
              var cands=document.querySelectorAll('li,div,span,a,[role=option],[role=listitem],button,label,td');
              for(var i=0;i<cands.length;i++){
                var e=cands[i];
                if(!R.vis(e)||R.inNav(e)||e===box)continue;
                var t=R.txt(e);
                if(t.length<40 && WANT.test(t) && nearBox(e)){
                  e.click();
